<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no is requested by this repo's owner for an app-like feel.
         Worth knowing what it does and does not do: Firefox Android ignores it
         (and its own zoom handling previously mis-scaled the page, which is why
         html{font-size:16px} and text-size-adjust:100% are pinned in global.css
         — do not remove those), iOS 10+ ignores it too, and where it IS honoured
         it blocks pinch-zoom for anyone who needs to magnify. The reliable half
         of this is touch-action: manipulation on controls, which kills
         double-tap-to-zoom everywhere without taking pinch away. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071019" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BYD SL6 VN" />
    <!-- Club logo. Small sizes carry the BYD mark alone: the "Sealion 6 Viet Nam
         Club" line is unreadable below ~64px and just muddies the tab icon. -->
    <link rel="icon" href="%BASE_URL%icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>BYD SL6 VN</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
