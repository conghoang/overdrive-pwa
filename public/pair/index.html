<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pair a watch · OverDrive</title>
<style>
  :root{--bg:#071019;--surface:#0c1724;--border:rgba(168,198,220,.12);--accent:#35dfc1;
    --on-accent:#071019;--text:#f5f9fc;--mid:#8497a8;--danger:#ff6b6b;--ok:#56d68c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Roboto",sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px 22px;gap:18px;text-align:center}
  .bolt{width:40px;height:40px}
  h1{font-size:20px;font-weight:800;margin:0}
  p{margin:0;color:var(--mid);font-size:14px;line-height:1.45;max-width:30ch}
  .card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);
    border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
  label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);font-weight:700;text-align:left}
  input{width:100%;background:#0a1622;border:1px solid var(--border);border-radius:12px;color:var(--text);
    font-size:24px;font-weight:800;letter-spacing:.22em;text-align:center;padding:14px 10px;text-transform:uppercase}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;height:50px;border:0;border-radius:25px;background:var(--accent);color:var(--on-accent);
    font-size:16px;font-weight:800;cursor:pointer}
  button:disabled{opacity:.5}
  .msg{font-size:14px;font-weight:600;min-height:20px}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--danger)}
  .big{font-size:44px;line-height:1}
  .spin{width:26px;height:26px;border:3px solid var(--accent);border-right-color:transparent;
    border-radius:50%;animation:spin .7s linear infinite;margin:6px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scanbtn{display:flex;align-items:center;justify-content:center;gap:8px}
  .scanbtn svg{width:20px;height:20px}
  .or{display:flex;align-items:center;gap:10px;color:var(--mid);font-size:12px;font-weight:600}
  .or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}
  .ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  /* Full-screen camera scanner */
  #scanview{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #cam{width:100%;height:100%;object-fit:cover}
  .scanframe{position:absolute;width:62vw;max-width:280px;aspect-ratio:1;border:3px solid var(--accent);
    border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .scantip{position:absolute;top:12%;left:0;right:0;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px #000}
  #scancancel{position:absolute;bottom:8%;width:auto;padding:0 26px;background:rgba(255,255,255,.14);color:#fff}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <svg class="bolt" viewBox="0 0 24 24"><path d="M13 2.5 5 13.2h5.2l-1 8.3 8-11.2h-5.2z" fill="#35dfc1"/></svg>
  <h1>Pair a watch</h1>

  <!-- Auto (opened by scanning the watch QR) -->
  <div id="auto" hidden>
    <div class="spin" id="autospin"></div>
    <div class="msg" id="automsg">Pairing…</div>
  </div>

  <!-- Manual: scan the watch QR, or type the 6-char code -->
  <div class="card" id="manual" hidden>
    <button id="scan" class="scanbtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>
      Scan QR
    </button>
    <div class="or">or</div>
    <label for="code">Code shown on watch</label>
    <input id="code" inputmode="latin" autocomplete="off" maxlength="6" placeholder="——————" />
    <button id="go" class="ghost">Pair with code</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- Camera scanner -->
  <div id="scanview" hidden>
    <video id="cam" playsinline muted></video>
    <div class="scantip">Point at the QR on your watch</div>
    <div class="scanframe"></div>
    <button id="scancancel">Cancel</button>
  </div>

  <p id="hint">Scan the QR on your watch, or enter its 6-character code.</p>

<script>
const ls=(k)=>{try{return localStorage.getItem(k)}catch{return null}};
const PAIR_API=(ls('odw.pairApi')||'https://watch-pair.sl6vn.link').replace(/\/$/,'');
const $=(id)=>document.getElementById(id);
const b64u=(buf)=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=(s)=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const SC=crypto.subtle,EC={name:'ECDH',namedCurve:'P-256'};

// The phone's live session (same origin as the OverDrive PWA → shared storage).
function session(){
  const baseUrl=ls('odpwa.baseUrl'),jwt=ls('odpwa.jwt');
  if(!baseUrl||!jwt||baseUrl==='demo') return null;
  return {baseUrl,jwt,deviceId:ls('odpwa.deviceId')||''};
}

async function sealAndSend(code,watchPub){
  const sess=session();
  if(!sess) throw new Error('Open OverDrive and sign in on this phone first.');
  const kp=await SC.generateKey(EC,false,['deriveKey']);
  const phonePub=b64u(await SC.exportKey('raw',kp.publicKey));
  const watchKey=await SC.importKey('raw',ub64(watchPub),EC,false,[]);
  const aes=await SC.deriveKey({name:'ECDH',public:watchKey},kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await SC.encrypt({name:'AES-GCM',iv},aes,new TextEncoder().encode(JSON.stringify(sess)));
  const r=await fetch(PAIR_API+'/put',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code,phonePub,iv:b64u(iv),ct:b64u(ct)})}).then(x=>x.json());
  if(r.status==='expired') throw new Error('That code expired — start again on the watch.');
  if(!r.ok) throw new Error('Pairing failed. Try again.');
}

// Auto path: opened via QR with #c=<code>&k=<watchPub>
async function auto(code,watchPub){
  $('hint').hidden=true;$('auto').hidden=false;
  try{
    await sealAndSend(code,watchPub);
    $('autospin').hidden=true;$('automsg').className='msg ok';
    $('automsg').innerHTML='✓ Paired<br><span style="color:var(--mid);font-weight:400">Your watch is connecting…</span>';
  }catch(e){
    $('autospin').hidden=true;$('automsg').className='msg err';$('automsg').textContent=e.message;
    setTimeout(()=>{$('auto').hidden=true;$('manual').hidden=false;$('hint').hidden=false;},1800);
  }
}

async function manualPair(){
  const code=$('code').value.trim().toUpperCase();
  if(code.length<6){$('msg').className='msg err';$('msg').textContent='Enter the 6-character code.';return;}
  $('go').disabled=true;$('msg').className='msg';$('msg').textContent='Pairing…';
  try{
    const pub=await fetch(PAIR_API+'/pub?code='+code).then(x=>x.json());
    if(pub.status==='expired') throw new Error('That code expired — start again on the watch.');
    await sealAndSend(code,pub.watchPub);
    $('msg').className='msg ok';$('msg').textContent='✓ Paired — check your watch.';
  }catch(e){$('msg').className='msg err';$('msg').textContent=e.message;}
  finally{$('go').disabled=false;}
}

// ---- In-page QR scanner (BarcodeDetector, jsQR fallback) ----
function parseScan(text){
  try{ const p=new URLSearchParams(new URL(text).hash.slice(1)); if(p.get('c')&&p.get('k')) return {c:p.get('c').toUpperCase(),k:p.get('k')}; }catch{}
  return null;
}
function loadJsQR(){return new Promise((res,rej)=>{ if(window.jsQR)return res();
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function startScan(){
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}); }
  catch(e){ $('manual').hidden=false;$('msg').className='msg err';$('msg').textContent='Camera unavailable — enter the code instead.'; return; }
  $('scanview').hidden=false;
  const v=$('cam');v.srcObject=stream;await v.play().catch(()=>{});
  const stop=()=>{stream.getTracks().forEach(t=>t.stop());$('scanview').hidden=true;};
  $('scancancel').onclick=stop;
  let detector=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  if(!detector){ try{await loadJsQR();}catch{} }
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  let done=false;
  const tick=async()=>{
    if(done||$('scanview').hidden)return;
    let text=null;
    try{
      if(detector){ const c=await detector.detect(v); if(c&&c[0])text=c[0].rawValue; }
      else if(window.jsQR&&v.videoWidth){ cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
        const img=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(img.data,img.width,img.height);if(r)text=r.data; }
    }catch{}
    const parsed=text&&parseScan(text);
    if(parsed){ done=true;stop();return auto(parsed.c,parsed.k); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

const h=new URLSearchParams(location.hash.slice(1));
if(h.get('c')&&h.get('k')){ auto(h.get('c').toUpperCase(),h.get('k')); }
else { $('manual').hidden=false; }
$('scan').addEventListener('click',startScan);
$('go').addEventListener('click',manualPair);
$('code').addEventListener('keydown',(e)=>{if(e.key==='Enter')manualPair();});
</script>
</body>
</html>
