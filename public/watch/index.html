<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>OverDrive Watch</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#071019" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  /* Verbatim from the phone app's tokens.css so the watch is the same product. */
  :root{
    --bg:#071019; --surface-1:#0c1724; --surface-2:#101f30; --border:rgba(168,198,220,.12);
    --accent:#35dfc1; --accent-bright:#35dfc1;
    --success:#56d68c; --m-orange:#f6a23c; --text:#f5f9fc; --mid:#8497a8; --danger:#ff6b6b;
    --radius:16px; --shadow:0 10px 26px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:system-ui,-apple-system,"Roboto",sans-serif;font-variant-numeric:tabular-nums;
    -webkit-user-select:none;user-select:none}

  #pager{display:flex;height:100%;width:100%;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scrollbar-width:none}
  #pager::-webkit-scrollbar{display:none}
  .panel{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12%;text-align:center}
  .ptitle{position:absolute;top:9%;left:0;right:0;font-size:11px;letter-spacing:.12em;
    font-weight:800;text-transform:uppercase;color:var(--mid)}

  #dots{position:fixed;bottom:5.5%;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:5}
  #dots i{width:5px;height:5px;border-radius:50%;background:var(--mid);opacity:.4;transition:.2s}
  #dots i.on{opacity:1;background:var(--accent);width:13px;border-radius:3px}

  /* ---- Panel 1: range + battery/fuel bars (the PWA hero) ---- */
  .veh-range{display:flex;align-items:baseline;justify-content:center;gap:6px}
  .veh-range .num{font-size:min(15vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1}
  .veh-range .unit{font-size:16px;color:var(--mid);font-weight:600}
  .legs{width:96%;margin-top:18px;display:flex;flex-direction:column;gap:13px}
  .leg-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .leg-ico{display:flex;flex:0 0 auto}.leg-ico svg{width:15px;height:15px}
  .leg-km{margin-left:auto;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .leg-km small{font-size:11px;opacity:.7;font-weight:600}
  .leg-pct{font-size:11px;font-weight:700;color:var(--mid);min-width:30px;text-align:right}
  .leg-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .leg-bar i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.22,.61,.36,1)}

  /* ---- Panel 2: quick buttons (PWA quick-btn) ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:80%;max-width:224px}
  .qbtn{aspect-ratio:1;border-radius:var(--radius);background:var(--surface-1);
    border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;color:var(--text);cursor:pointer;transition:transform .08s}
  .qbtn:active{transform:scale(.95)}
  .qbtn .qi{color:var(--accent-bright);display:flex}.qbtn .qi svg{width:25px;height:25px}
  .qbtn span{font-size:11px;font-weight:600}
  .qbtn.on{border-color:var(--success)}.qbtn.on .qi{color:var(--success)}
  .qbtn.warn{border-color:var(--m-orange)}.qbtn.warn .qi{color:var(--m-orange)}

  /* ---- Panel 3: climate ---- */
  .power{width:80px;height:80px;border-radius:50%;background:var(--surface-1);border:1px solid var(--border);
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;transition:.15s}
  .power.on{background:var(--accent);color:var(--bg);border-color:transparent;box-shadow:0 0 0 5px rgba(53,223,193,.15)}
  .power svg{width:34px;height:34px}
  .stepper{display:flex;align-items:center;gap:14px;margin-top:12px}
  .stepper button{width:40px;height:40px;border-radius:50%;background:var(--surface-1);border:1px solid var(--border);
    color:var(--text);font-size:22px;font-weight:600;cursor:pointer}.stepper button:active{background:var(--surface-2)}
  .temp{font-size:28px;font-weight:800;letter-spacing:-.03em;min-width:66px}.temp small{font-size:.5em;color:var(--mid)}
  .fanwrap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:88px}
  .fanbar{display:flex;gap:3px}
  .fanseg{width:8px;height:16px;border-radius:3px;background:var(--surface-2);transition:.12s}
  .fanseg.on{background:var(--accent)}
  .fanlabel{font-size:11px;color:var(--mid);font-weight:700}.fanlabel b{color:var(--text)}

  /* ---- Panel 4: seats (heat + cool) ---- */
  .seatcol{width:88%;max-width:250px;display:flex;flex-direction:column;gap:11px}
  .seatname{font-size:12px;font-weight:800;letter-spacing:.02em;text-align:left;margin-bottom:5px}
  .seatline{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .seatline .ic{width:15px;height:15px;flex:0 0 auto;display:flex}
  .slevels{display:flex;gap:5px;margin-left:auto}
  .sl{width:20px;height:19px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:.12s}
  .sl.on.heat{background:var(--m-orange);border-color:transparent}
  .sl.on.cool{background:var(--accent);border-color:transparent}

  /* ---- Panel 5: tyres ---- */
  .tyres{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px;width:72%;max-width:208px}
  .ty{display:flex;flex-direction:column;align-items:center}
  .ty b{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--success)}
  .ty.low b{color:var(--m-orange)}.ty.dim b{color:var(--mid)}
  .ty small{font-size:9px;letter-spacing:.1em;color:var(--mid);font-weight:700;margin-top:2px}

  /* ---- Panel 6: logout ---- */
  .logout{width:80%;max-width:196px;height:48px;border-radius:24px;background:transparent;
    border:1px solid var(--danger);color:var(--danger);font-size:15px;font-weight:700;cursor:pointer}
  .logout:active{background:rgba(255,107,107,.12)}

  .state{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:16%;text-align:center;background:var(--bg);z-index:10}
  .state p{margin:0;font-size:14px}.state .sub{color:var(--mid);font-size:12px;line-height:1.35}
  .pairqr{background:#fff;padding:7px;border-radius:12px;line-height:0;width:130px;height:130px}
  .pairqr svg{width:100%;height:100%;display:block}
  .paircode{font-size:26px;font-weight:800;letter-spacing:.16em;color:var(--accent);margin-top:2px}
  .retry{padding:9px 20px;border-radius:20px;background:var(--accent);color:var(--bg);border:0;font-weight:700}
  #toast{position:fixed;left:50%;bottom:13%;transform:translateX(-50%) translateY(16px);background:var(--surface-2);
    border:1px solid var(--border);padding:7px 15px;border-radius:16px;font-size:12.5px;font-weight:600;opacity:0;
    transition:.2s;pointer-events:none;z-index:20;max-width:74%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{color:var(--danger)}
  .busy{opacity:.55;pointer-events:none}
  .spin{width:18px;height:18px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  [hidden]{display:none!important}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="state" id="state"><div class="spin"></div></div>

<div id="pager" hidden>
  <!-- 1 · Status -->
  <section class="panel">
    <div class="veh-range"><span class="num" id="range">--</span><span class="unit" id="unit">km</span></div>
    <div class="legs">
      <div class="leg" id="leg-ev">
        <div class="leg-head">
          <span class="leg-ico" style="color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M21.5 10.5v3"/></svg></span>
          <span class="leg-km" id="ev-km" style="color:var(--success)">--<small> km</small></span>
          <span class="leg-pct" id="ev-pct">--</span>
        </div>
        <div class="leg-bar"><i id="ev-bar" style="width:0;background:var(--success)"></i></div>
      </div>
      <div class="leg" id="leg-fuel" hidden>
        <div class="leg-head">
          <span class="leg-ico" style="color:var(--m-orange)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="2"/><path d="M4 10h10"/><path d="M14 7l3.2 3.2a2 2 0 0 1 .6 1.4V17a1.8 1.8 0 0 0 3.2 1.2"/></svg></span>
          <span class="leg-km" id="fuel-km" style="color:var(--m-orange)">--<small> km</small></span>
          <span class="leg-pct" id="fuel-pct">--</span>
        </div>
        <div class="leg-bar"><i id="fuel-bar" style="width:0;background:var(--m-orange)"></i></div>
      </div>
      <div class="leg-head" id="chgline" style="justify-content:center;margin-top:2px;min-height:14px;color:var(--success)"></div>
    </div>
  </section>

  <!-- 2 · Controls -->
  <section class="panel">
    <div class="grid2">
      <div class="qbtn" data-act="lock" id="b-lock"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span>Lock</span></div>
      <div class="qbtn" data-act="unlock" id="b-unlock"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></span><span>Unlock</span></div>
      <div class="qbtn" data-act="trunk"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.9h3.3"/><path d="M13.5 16.9h5.6a2.1 2.1 0 0 0 2.1-2.3l-.6-4.7a2.5 2.5 0 0 0-2-2.1L11.7 7.5"/><path d="M2.4 4.1c4.6.1 7.4.8 9.3 3.4"/><path d="M11.7 7.5c1.9-1.9 4.2-2.9 7.5-2.8"/><circle cx="9.7" cy="16.9" r="2.9"/></svg></span><span>Trunk</span></div>
      <div class="qbtn" data-act="flash"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 3 2 5 2 7h10c0-2 2-4 2-7a7 7 0 0 0-7-7z"/><path d="M9 21h6"/></svg></span><span>Find</span></div>
    </div>
  </section>

  <!-- 3 · Climate -->
  <section class="panel">
    <div class="ptitle">Climate</div>
    <div class="power" data-act="clima" id="clima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg></div>
    <div class="stepper">
      <button data-act="temp-">−</button><div class="temp" id="temp">22<small>°</small></div><button data-act="temp+">+</button>
    </div>
    <div class="stepper" style="margin-top:12px">
      <button data-act="fan-">−</button>
      <div class="fanwrap">
        <div class="fanbar" id="fanbar"></div>
        <div class="fanlabel">Fan <b id="fannum">–</b></div>
      </div>
      <button data-act="fan+">+</button>
    </div>
  </section>

  <!-- 4 · Seats (heat + cool) -->
  <section class="panel">
    <div class="ptitle">Seats</div>
    <div class="seatcol" id="seats"></div>
  </section>

  <!-- 5 · Tyres -->
  <section class="panel">
    <div class="ptitle">Tyre · kPa</div>
    <div class="tyres">
      <div class="ty" id="ty-fl"><b>—</b><small>FL</small></div><div class="ty" id="ty-fr"><b>—</b><small>FR</small></div>
      <div class="ty" id="ty-rl"><b>—</b><small>RL</small></div><div class="ty" id="ty-rr"><b>—</b><small>RR</small></div>
    </div>
  </section>

  <!-- 6 · Account -->
  <section class="panel">
    <div class="ptitle">Account</div>
    <button class="logout" data-act="logout">Sign out</button>
    <div class="leg-pct" style="margin-top:12px" id="devid"></div>
  </section>
</div>

<div id="dots" hidden></div>
<div id="toast"></div>

<script>
const qs=new URLSearchParams(location.search),demo=qs.has('demo');
const ls=(k)=>{try{return localStorage.getItem(k)}catch{return null}};
const lss=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const BASE=(qs.get('b')||ls('odw.baseUrl')||'').replace(/\/$/,''),JWT=qs.get('t')||ls('odw.jwt')||'';
const $=(id)=>document.getElementById(id);
// Pairing bridge (Cloudflare Worker). Override without editing via localStorage.
const PAIR_API=(ls('odw.pairApi')||'https://watch-pair.sl6vn.link').replace(/\/$/,'');
const PAIR_PAGE=location.origin+location.pathname.replace(/watch\/?$/,'pair/');
const b64u=(buf)=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=(s)=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const SC=crypto.subtle,EC={name:'ECDH',namedCurve:'P-256'};
let tempC=22,climaOn=false,fanLevel=0,seatHeat=[0,0],seatCool=[0,0],ventSupported=false,busy=false;

async function api(path,opts={}){
  if(demo) return demoResp(path,opts);
  const res=await fetch(BASE+path,{method:opts.method||'GET',
    headers:Object.assign({Authorization:'Bearer '+JWT},opts.body?{'Content-Type':'application/json'}:{}),body:opts.body});
  if(res.status===401){const e=new Error('auth');e.auth=1;throw e;}
  const ct=res.headers.get('content-type')||'';return ct.includes('json')?res.json():{};
}
function demoResp(path,opts){
  if(opts.method==='POST') return Promise.resolve({success:true});
  if(path==='/status') return Promise.resolve({distanceUnit:'km',
    soc:{percent:68},range:{totalRangeKm:495,elecRangeKm:78,fuelRangeKm:417,fuelPercent:55,isPhev:true},
    charging:{charging:true,plugged:true,chargingPowerKW:7.2}});
  if(path.startsWith('/api/vehicle/state')) return Promise.resolve({doors:{overall:1},
    climate:{acOn:true,setpointDriver:22,fanLevel:3},
    seats:{heat:[2,0],cool:[0,1],ventilatedSupported:true},
    tyres:{available:true,fl:{kPa:240,pressureState:0},fr:{kPa:238,pressureState:0},
      rl:{kPa:205,pressureState:1},rr:{kPa:242,pressureState:0},limits:{frontLow:220,rearLow:220}}});
  return Promise.resolve({});
}
const pctClamp=(p)=>Math.max(0,Math.min(100,p||0));
const kpa=(t)=>t&&typeof t.kPa==='number'?Math.round(t.kPa):null;
function renderTyre(id,t,limits){
  const el=$(id),b=el.querySelector('b'),v=kpa(t);el.className='ty';
  if(v==null||t?.available===false){b.textContent='—';el.classList.add('dim');return;}
  b.textContent=v;
  const low=(limits&&((id.includes('f')&&v<(limits.frontLow||0))||(id.includes('r')&&v<(limits.rearLow||0))))||(t.pressureState&&t.pressureState!==0);
  if(low) el.classList.add('low');
}
const FLAME='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#f6a23c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0c2 2 3 3 3 6a5 5 0 0 1-10 0c0-4 5-6 5-13z"/></svg>';
const SNOW='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#35dfc1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>';
function levelRow(pos,mode,cur){
  let h='<div class="seatline">'+(mode==='heat'?FLAME:SNOW)+'<div class="slevels">';
  for(let i=1;i<=3;i++) h+='<div class="sl '+mode+(i<=cur?' on':'')+'" data-seat="'+pos+'" data-mode="'+mode+'" data-level="'+(i===cur?0:i)+'"></div>';
  return h+'</div></div>';
}
function renderSeats(){
  const col=$('seats');col.innerHTML='';
  for(const pos of[1,2]){
    const name=pos===1?'Driver':'Passenger';
    let blk='<div class="seatblk"><div class="seatname">'+name+'</div>';
    blk+=levelRow(pos,'heat',seatHeat[pos-1]||0);
    if(ventSupported) blk+=levelRow(pos,'cool',seatCool[pos-1]||0);
    col.insertAdjacentHTML('beforeend',blk+'</div>');
  }
}
function renderFan(){const fb=$('fanbar');fb.innerHTML='';
  for(let i=1;i<=7;i++){const d=document.createElement('div');d.className='fanseg'+(i<=fanLevel?' on':'');fb.appendChild(d);}
  $('fannum').textContent=fanLevel||'–';}
function setFan(n){fanLevel=Math.max(0,Math.min(7,n));renderFan();
  fire('Fan','/api/vehicle/climate',{action:'set_fan',fan:fanLevel});}
function renderClimate(){$('clima').classList.toggle('on',climaOn);$('temp').innerHTML=tempC+'<small>°</small>';renderFan();}

function renderQR(id,text){
  const draw=()=>{try{const q=qrcode(0,'M');q.addData(text);q.make();$(id).innerHTML=q.createSvgTag({cellSize:4,margin:0});}catch{}};
  if(window.qrcode)return draw();
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  s.onload=draw;s.onerror=()=>{};document.head.appendChild(s);
}
async function startPairing(){
  showState('<div class="spin"></div>');
  try{
    const kp=await SC.generateKey(EC,false,['deriveKey']);
    const watchPub=b64u(await SC.exportKey('raw',kp.publicKey));
    const r=await fetch(PAIR_API+'/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({watchPub})}).then(x=>x.json());
    if(!r.code) throw 0;
    const url=PAIR_PAGE+'#c='+r.code+'&k='+watchPub;
    $('state').innerHTML='<div class="pairqr" id="pairqr"></div><div class="paircode">'+r.code+'</div>'
      +'<div class="sub">Scan in the phone app,<br>or enter this code</div>';
    renderQR('pairqr',url);
    pollPair(r.code,kp);
  }catch(e){ showState('<p>Pairing unavailable</p><button class="retry" onclick="startPairing()">Retry</button>'); }
}
function pollPair(code,kp){
  let stop=false;
  const tick=async()=>{
    if(stop)return;
    let r;try{r=await fetch(PAIR_API+'/get?code='+code).then(x=>x.json());}catch{return setTimeout(tick,1600);}
    if(r.status==='ready'){
      stop=true;
      try{
        const phonePubKey=await SC.importKey('raw',ub64(r.phonePub),EC,false,[]);
        const aes=await SC.deriveKey({name:'ECDH',public:phonePubKey},kp.privateKey,{name:'AES-GCM',length:256},false,['decrypt']);
        const pt=await SC.decrypt({name:'AES-GCM',iv:ub64(r.iv)},aes,ub64(r.ct));
        const sess=JSON.parse(new TextDecoder().decode(pt));
        lss('odw.baseUrl',sess.baseUrl);lss('odw.jwt',sess.jwt);if(sess.deviceId)lss('odw.deviceId',sess.deviceId);
        location.reload();
      }catch(e){ showState('<p>Pairing failed</p><button class="retry" onclick="startPairing()">Retry</button>'); }
      return;
    }
    if(r.status==='expired'){stop=true;return startPairing();}
    setTimeout(tick,1600);
  };
  setTimeout(tick,1600);
}
async function load(){
  if(!demo&&(!BASE||!JWT)) return startPairing();
  showState('<div class="spin"></div>');
  try{
    const s=await api('/status');let st={};try{st=await api('/api/vehicle/state');}catch{}
    const unit=s.distanceUnit||'km',r=s.range||{},ch=s.charging||{};
    $('range').textContent=(r.totalRangeKm??r.elecRangeKm??'--');$('unit').textContent=unit;
    // EV leg
    $('ev-km').innerHTML=(r.elecRangeKm??'--')+'<small> '+unit+'</small>';
    $('ev-pct').textContent=s.soc?.percent!=null?Math.round(s.soc.percent)+'%':'--';
    $('ev-bar').style.width=pctClamp(s.soc?.percent)+'%';
    // Fuel leg (PHEV)
    if(r.isPhev){$('leg-fuel').hidden=false;
      $('fuel-km').innerHTML=(r.fuelRangeKm??'--')+'<small> '+unit+'</small>';
      $('fuel-pct').textContent=r.fuelPercent!=null?Math.round(r.fuelPercent)+'%':'--';
      $('fuel-bar').style.width=pctClamp(r.fuelPercent)+'%';}
    else $('leg-fuel').hidden=true;
    $('chgline').innerHTML=(ch.charging||ch.plugged)
      ?'<svg viewBox="0 0 24 24" width="12" height="12"><path d="M13 3 6 13h5l-1 8 7-11h-5z" fill="var(--success)"/></svg>&nbsp;'
        +'<span style="font-size:12px;font-weight:700">'+(ch.charging?(ch.chargingPowerKW?ch.chargingPowerKW.toFixed(1)+' kW':'Charging'):'Plugged in')+'</span>':'';

    const lock=st.doors?.overall??-1;
    $('b-lock').className='qbtn'+(lock===1?' on':'');
    $('b-unlock').className='qbtn'+(lock===2?' warn':'');
    climaOn=!!st.climate?.acOn;
    if(typeof st.climate?.setpointDriver==='number')tempC=Math.round(st.climate.setpointDriver);
    fanLevel=st.climate?.fanLevel||0;renderClimate();
    const h=st.seats?.heat||[],c=st.seats?.cool||[];seatHeat=[h[0]||0,h[1]||0];seatCool=[c[0]||0,c[1]||0];
    ventSupported=!!st.seats?.ventilatedSupported;renderSeats();
    const T=st.tyres||{};renderTyre('ty-fl',T.fl,T.limits);renderTyre('ty-fr',T.fr,T.limits);renderTyre('ty-rl',T.rl,T.limits);renderTyre('ty-rr',T.rr,T.limits);
    $('devid').textContent=demo?'DEMO-SEAL-01':'';
    hideState();
  }catch(e){if(e.auth)return showState('<p>Session ended</p><p class="sub">Re-pair from the phone</p>');
    showState('<p>Can’t reach car</p><button class="retry" onclick="load()">Retry</button>');}
}
function showState(h){$('state').innerHTML=h;$('state').hidden=false;$('pager').hidden=true;$('dots').hidden=true;}
function hideState(){$('state').hidden=true;$('pager').hidden=false;$('dots').hidden=false;}
let toastT;function toast(m,err){const t=$('toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1700);}
async function fire(label,path,body){
  if(busy)return;busy=true;document.body.classList.add('busy');
  try{const r=await api(path,{method:'POST',body:body?JSON.stringify(body):undefined});
    toast(r.success===false?(r.error||label+' failed'):label+' ✓',r.success===false);if(r.success!==false)await load();}
  catch(e){if(e.auth)return showState('<p>Session ended</p><p class="sub">Re-pair from the phone</p>');toast(label+' failed',true);}
  finally{busy=false;document.body.classList.remove('busy');}
}
document.addEventListener('click',(ev)=>{
  const sl=ev.target.closest('.sl');
  if(sl){const mode=sl.dataset.mode==='cool'?'ventilation':'heating';
    fire('Seat','/api/vehicle/seat',{action:mode,position:+sl.dataset.seat,level:+sl.dataset.level});return;}
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='lock')fire('Lock','/api/vehicle/lock');
  else if(a==='unlock')fire('Unlock','/api/vehicle/unlock');
  else if(a==='trunk')fire('Trunk','/api/vehicle/trunk',{action:'open'});
  else if(a==='flash')fire('Find','/api/vehicle/flash');
  else if(a==='clima')fire(climaOn?'Climate off':'Climate on','/api/vehicle/climate',climaOn?{action:'power_off'}:{action:'power_on',temp:tempC,remoteDurationMinutes:15});
  else if(a==='temp+'){tempC=Math.min(30,tempC+1);renderClimate();if(climaOn)fire('Temp','/api/vehicle/climate',{action:'set_temp',zone:0,temp:tempC});}
  else if(a==='temp-'){tempC=Math.max(16,tempC-1);renderClimate();if(climaOn)fire('Temp','/api/vehicle/climate',{action:'set_temp',zone:0,temp:tempC});}
  else if(a==='fan+')setFan(fanLevel+1);
  else if(a==='fan-')setFan(fanLevel-1);
  else if(a==='logout'){if(window.OdNative&&OdNative.logout)OdNative.logout();
    else{try{localStorage.removeItem('odw.baseUrl');localStorage.removeItem('odw.jwt');}catch{}location.href=location.pathname;}}
});
const N=6,dots=$('dots');for(let i=0;i<N;i++)dots.appendChild(document.createElement('i'));
const pager=$('pager');
function updateDots(){const i=Math.round(pager.scrollLeft/pager.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));}
pager.addEventListener('scroll',updateDots,{passive:true});updateDots();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
