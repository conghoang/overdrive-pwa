<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>OverDrive Watch</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#071019" id="themeColor" />
<script>
  // Apply the saved theme before first paint so there's no light/dark flash.
  try{var _th=localStorage.getItem('odw.theme');if(_th==='light'){document.documentElement.dataset.theme='light';
    var _m=document.getElementById('themeColor')||document.querySelector('meta[name=theme-color]');if(_m)_m.content='#e9eef3';}}catch(e){}
</script>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  /* Verbatim from the phone app's tokens.css so the watch is the same product. */
  /* Dark is the default (bare :root); light overrides only the colour tokens. */
  :root{
    --bg:#071019; --surface-1:#0c1724; --surface-2:#101f30; --border:rgba(168,198,220,.12);
    --accent:#35dfc1; --accent-bright:#35dfc1;
    --success:#56d68c; --m-orange:#f6a23c; --text:#f5f9fc; --mid:#8497a8; --danger:#ff6b6b;
    --on-teal:#071019; --on-accent:#071019;
    --btn-bg:rgba(12,23,36,.66); --btn-bg-active:rgba(16,31,48,.8);
    --radius:16px; --shadow:0 10px 26px rgba(0,0,0,.34);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#e9eef3; --surface-1:#ffffff; --surface-2:#dbe4ec; --border:rgba(18,44,66,.16);
    --accent:#22c9ac; --accent-bright:#0e9e88;
    --success:#2ea866; --m-orange:#c9760f; --text:#0b1a24; --mid:#5c6d7a; --danger:#d6453f;
    --on-teal:#04150f; --on-accent:#04150f;
    --btn-bg:rgba(255,255,255,.66); --btn-bg-active:rgba(219,228,236,.82);
    --shadow:0 10px 26px rgba(20,40,60,.14);
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:system-ui,-apple-system,"Roboto",sans-serif;font-variant-numeric:tabular-nums;
    -webkit-user-select:none;user-select:none}
  /* Pin the app to the viewport so nothing (focus scroll-into-view, overscroll,
     a stray horizontal offset) can shift the content off the round screen. */
  body{position:fixed;inset:0;width:100%;overscroll-behavior:none}

  #pager{display:flex;height:100%;width:100%;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scrollbar-width:none}
  #pager::-webkit-scrollbar{display:none}
  #pager:focus{outline:none}
  /* Invisible vertical scroller behind everything: receives rotary/bezel input.
     z-index:-1 keeps it clear of touch; it just needs focus + room to scroll. */
  #rotsink{position:fixed;inset:0;overflow-y:scroll;overscroll-behavior:contain;
    opacity:0;z-index:-1;scrollbar-width:none;outline:none}
  #rotsink::-webkit-scrollbar{display:none}
  #rotsink>div{height:300%}
  /* Pull-to-refresh indicator (the Wear browser has no reload). */
  #ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-70px);z-index:40;
    width:11vmin;height:11vmin;border-radius:50%;background:var(--btn-bg);opacity:0;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
    pointer-events:none}
  #ptr .ptr-spin{width:6vmin;height:6vmin;border:.7vmin solid var(--mid);
    border-top-color:var(--accent);border-radius:50%}
  #ptr.spin .ptr-spin{animation:spin .7s linear infinite}
  :root[data-shape="rect"] .panel{padding:0 5%}
  :root[data-shape="rect"] .ptitle{top:5%}
  :root[data-shape="rect"] #dots{bottom:3%}
  /* scroll-snap-stop:always: a fast flick can carry momentum past a snap point
     and skip a panel. This forces the scroll to rest on the very next panel, so
     one swipe = one screen. */
  .panel{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10%;text-align:center}
  .ptitle{position:absolute;top:11%;left:0;right:0;font-size:4.6vmin;letter-spacing:.12em;
    font-weight:800;text-transform:uppercase;color:var(--mid)}

  #dots{position:fixed;bottom:5%;left:50%;transform:translateX(-50%);display:flex;gap:2vmin;z-index:5}
  #dots i{width:2vmin;height:2vmin;border-radius:50%;background:var(--mid);opacity:.4;transition:.2s}
  #dots i.on{opacity:1;background:var(--accent);width:6vmin;border-radius:1vmin}

  /* ---- Panel 1: range + battery/fuel bars (the PWA hero) ---- */
  /* Backdrops are pre-baked per theme: square, display-sized, with the fade and
     the theme background already composited in. The browser just blits an opaque
     bitmap — no runtime opacity layer, crop, or scale work. */
  #p-status>*:not(.carbg){position:relative;z-index:1}
  .carbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0}
  /* Per-panel PWA backdrops (climate/seat/tyre): fill the round face, content on
     top. Interior shots use cover; the chassis (4 wheels) is contained so all
     four tyres read behind the four pressures. */
  #p-climate>*:not(.panelbg),#p-seat>*:not(.panelbg){position:relative;z-index:1}
  .panelbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0}
  /* Buttons are a plain translucent surface — the backdrop still shows through,
     but with no backdrop-filter blur, so there's zero per-frame GPU work. The
     slightly higher opacity keeps text/icons legible without the blur. */
  /* Contain each panel so the pager composites instead of repainting siblings. */
  .panel{contain:layout paint}
  .veh-range{display:flex;align-items:baseline;justify-content:center;gap:2vmin}
  .veh-range .num{font-size:22vmin;font-weight:700;letter-spacing:-.02em;line-height:1}
  .veh-range .unit{font-size:6.4vmin;color:var(--mid);font-weight:600}
  .legs{width:90%;margin:5vmin auto 0;display:flex;flex-direction:column;gap:4.5vmin}
  .leg-head{display:flex;align-items:center;gap:2.6vmin;margin-bottom:2.6vmin}
  .leg-ico{display:flex;flex:0 0 auto}.leg-ico svg{width:8.2vmin;height:8.2vmin}
  .leg-km{margin-left:auto;font-size:7.2vmin;font-weight:800;letter-spacing:-.01em}
  .leg-km small{font-size:4.2vmin;opacity:.7;font-weight:600}
  .leg-pct{font-size:4.6vmin;font-weight:700;color:var(--mid);min-width:12vmin;text-align:right}
  .leg-bar{height:4.2vmin;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .leg-bar i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.22,.61,.36,1)}
  /* Critical glance row: charge · temp · power · lock · windows. */
  .statusrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4vmin;
    margin-top:4vmin;min-height:6vmin}
  .schip{display:flex;align-items:center;gap:1.3vmin;font-size:4.6vmin;font-weight:800}
  .schip svg{width:7.8vmin;height:7.8vmin}

  /* ---- Settings ---- */
  .seg{display:inline-flex;background:var(--btn-bg);border:1px solid var(--border);border-radius:6vmin;padding:1vmin;margin-top:6vmin}
  .seg button{border:0;background:none;color:var(--mid);font-weight:800;font-size:4.4vmin;padding:1.6vmin 6vmin;border-radius:5vmin;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--on-teal)}
  /* Icon segs (theme): the glyph replaces the label; keep the pill height by
     matching the text seg's vertical padding. */
  #themeseg button{display:flex;align-items:center;justify-content:center;padding:1.4vmin 5.2vmin}
  #themeseg svg{width:6vmin;height:6vmin;display:block}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:4vmin;width:84%;max-width:78vmin;cursor:pointer}
  .setname{font-size:5.6vmin;font-weight:700}
  .switch{flex:0 0 auto;width:15vmin;height:9vmin;border-radius:4.5vmin;background:var(--btn-bg);
    border:1px solid var(--border);position:relative;transition:background .18s}
  .switch i{position:absolute;top:1vmin;left:1vmin;width:7vmin;height:7vmin;border-radius:50%;
    background:var(--mid);transition:transform .18s,background .18s}
  .switch.on{background:var(--accent);border-color:transparent}
  .switch.on i{transform:translateX(6vmin);background:var(--on-accent)}

  /* ---- Panel 2: quick buttons (PWA quick-btn) ---- */
  /* Cardinal-cross control buttons, icon only. */
  .cross{position:absolute;inset:0}
  .cbtn{position:absolute;width:31vmin;height:31vmin;border-radius:50%;background:var(--btn-bg);
    border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
    color:var(--accent-bright);cursor:pointer;transition:background .12s,border-color .15s}
  .cbtn:active{background:var(--btn-bg-active)}
  .cbtn svg{width:17vmin;height:17vmin}
  .cbtn.on{border-color:var(--success);color:var(--success)}
  .cbtn.warn{border-color:var(--m-orange);color:var(--m-orange)}
  .pN{top:4%;left:50%;transform:translateX(-50%)}
  .pS{bottom:8%;left:50%;transform:translateX(-50%)}
  .pW{left:4%;top:50%;transform:translateY(-50%)}
  .pE{right:4%;top:50%;transform:translateY(-50%)}
  /* Square/rectangular screens: use the corners — 2x2 grid instead of the cross. */
  :root[data-shape="rect"] .cross{display:grid;grid-template-columns:repeat(2,minmax(0,38vmin));
    gap:4vmin;justify-content:center;align-content:center;position:absolute;inset:0}
  :root[data-shape="rect"] .cbtn{position:static;transform:none;width:auto;height:auto;aspect-ratio:1;border-radius:24%}
  :root[data-shape="rect"] #b-lock{order:1}
  :root[data-shape="rect"] #b-unlock{order:2}
  :root[data-shape="rect"] .pW{order:3}
  :root[data-shape="rect"] #b4{order:4}

  /* ---- Panel 3: climate ---- */
  /* Centered cluster that stays inside the round face. */
  /* In the flex flow (first item) so it always sits at the top of the cluster,
     never overlapping the AC pill. Hidden when there's no reading. */
  .clima-out{display:flex;align-items:center;justify-content:center;gap:1.4vmin;
    font-size:4.8vmin;font-weight:700;color:var(--mid);margin-bottom:2.5vmin}
  .clima-out:empty{display:none}
  .clima-out svg{width:6.2vmin;height:6.2vmin}
  .clima-power{display:inline-flex;align-items:center;gap:2vmin;height:12vmin;padding:0 6vmin;border-radius:6vmin;
    background:var(--btn-bg);border:1px solid var(--border);color:var(--mid);font-weight:800;font-size:4.6vmin;
    letter-spacing:.04em;cursor:pointer;transition:.15s}
  .clima-power svg{width:7.4vmin;height:7.4vmin}
  .clima-power.on{background:var(--accent);color:var(--on-teal);border-color:transparent}
  .stepper{display:flex;align-items:center;justify-content:center;gap:3.4vmin}
  .stepper.temp-row{margin-top:5vmin}
  .stepper.fan-row{margin-top:4vmin;gap:3vmin}
  .stepper button{flex:0 0 auto;border-radius:50%;background:var(--btn-bg);border:1px solid var(--border);
    color:var(--text);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .temp-row button{width:16vmin;height:16vmin;font-size:8vmin}
  .fan-row button{width:12.5vmin;height:12.5vmin;font-size:6.5vmin}
  .stepper button:active{background:var(--btn-bg-active)}
  .temp{font-size:16vmin;font-weight:800;letter-spacing:-.03em;min-width:24vmin;line-height:1}
  .temp small{font-size:.42em;color:var(--mid);vertical-align:top}
  .fanwrap{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;min-width:26vmin}
  .fanbar{display:flex;gap:1vmin}
  .fanseg{width:2.8vmin;height:6vmin;border-radius:1vmin;background:var(--surface-2);transition:.12s}
  .fanseg.on{background:var(--accent)}
  .fanlabel{font-size:3.8vmin;color:var(--mid);font-weight:700;letter-spacing:.04em}.fanlabel b{color:var(--text)}

  /* ---- Panel 4: seats (heat + cool) ---- */
  /* Big tap-to-cycle tiles — one target per seat/mode, no tiny pills. */
  .seatgrid{display:grid;grid-template-columns:1fr 1fr;gap:3.4vmin;width:88%;max-width:82vmin}
  .seattile{min-height:31vmin;border-radius:var(--radius);background:var(--btn-bg);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8vmin;
    color:var(--text);cursor:pointer;transition:transform .08s,border-color .15s}
  .seattile:active{transform:scale(.95)}
  .seattile svg{width:10.5vmin;height:10.5vmin}
  .seattile .stname{font-size:3.8vmin;font-weight:700;color:var(--mid)}
  .seattile.on.heat{border-color:var(--m-orange)}
  .seattile.on.cool{border-color:var(--accent)}
  .slvl{display:flex;gap:1.6vmin}
  .slvl i{width:2.6vmin;height:2.6vmin;border-radius:50%;background:var(--surface-2)}
  .seattile.heat .slvl i.f{background:var(--m-orange)}
  .seattile.cool .slvl i.f{background:var(--accent)}

  /* ---- Panel 5: tyres ---- */
  /* Top-down car with each reading at its real corner (per the OD layout). */
  .tyremap{position:relative;width:100%;height:100%}
  .carmap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:58%;width:auto}
  .tyval{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1}
  .tyval b{font-size:10vmin;font-weight:800;letter-spacing:-.02em;color:var(--success)}
  .tyval.low b{color:var(--m-orange)}.tyval.dim b{color:var(--mid)}
  .tyval small{font-size:3.2vmin;letter-spacing:.14em;color:var(--mid);font-weight:700;margin-top:.8vmin}
  .tyval.fl{top:19%;left:13%}.tyval.fr{top:19%;right:13%}
  .tyval.rl{bottom:19%;left:13%}.tyval.rr{bottom:19%;right:13%}

  /* ---- Panel 6: logout ---- */
  .logout{width:80%;max-width:64vmin;height:15vmin;border-radius:8vmin;background:var(--btn-bg);
    border:1px solid var(--danger);color:var(--danger);font-size:5vmin;font-weight:700;cursor:pointer}
  .logout:active{background:rgba(255,107,107,.12)}

  .state{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:16%;text-align:center;background:var(--bg);z-index:10}
  .state p{margin:0;font-size:4.8vmin}.state .sub{color:var(--mid);font-size:3.8vmin;line-height:1.4}
  .pairqr{background:#fff;padding:2vmin;border-radius:4vmin;line-height:0;width:44vmin;height:44vmin}
  .pairqr svg{width:100%;height:100%;display:block}
  .paircode{font-size:9vmin;font-weight:800;letter-spacing:.16em;color:var(--accent);margin-top:1vmin}
  .retry{margin-top:4vmin;padding:3vmin 8vmin;border-radius:8vmin;background:var(--accent);color:var(--on-accent);border:0;font-weight:800;font-size:4.6vmin}
  #toast{position:fixed;left:50%;bottom:13%;transform:translateX(-50%) translateY(16px);background:var(--surface-2);
    border:1px solid var(--border);padding:7px 15px;border-radius:16px;font-size:12.5px;font-weight:600;opacity:0;
    transition:.2s;pointer-events:none;z-index:20;max-width:74%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{color:var(--danger)}
  .busy{opacity:.55;pointer-events:none}
  .spin{width:16vmin;height:16vmin;border:6px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  [hidden]{display:none!important}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="state" id="state"><div class="spin"></div></div>

<div id="pager" hidden>
  <!-- 1 · Status -->
  <section class="panel" id="p-status">
    <img class="carbg" data-bg="bg-car" alt="" aria-hidden="true">
    <div class="veh-range"><span class="num" id="range">--</span><span class="unit" id="unit">km</span></div>
    <div class="legs">
      <div class="leg" id="leg-ev">
        <div class="leg-head">
          <span class="leg-ico" style="color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M21.5 10.5v3"/></svg></span>
          <span class="leg-km" id="ev-km" style="color:var(--success)">--<small> km</small></span>
          <span class="leg-pct" id="ev-pct">--</span>
        </div>
        <div class="leg-bar"><i id="ev-bar" style="width:0;background:var(--success)"></i></div>
      </div>
      <div class="leg" id="leg-fuel" hidden>
        <div class="leg-head">
          <span class="leg-ico" style="color:var(--m-orange)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="2"/><path d="M4 10h10"/><path d="M14 7l3.2 3.2a2 2 0 0 1 .6 1.4V17a1.8 1.8 0 0 0 3.2 1.2"/></svg></span>
          <span class="leg-km" id="fuel-km" style="color:var(--m-orange)">--<small> km</small></span>
          <span class="leg-pct" id="fuel-pct">--</span>
        </div>
        <div class="leg-bar"><i id="fuel-bar" style="width:0;background:var(--m-orange)"></i></div>
      </div>
      <div class="statusrow" id="statusrow"></div>
    </div>
  </section>

  <!-- 2 · Controls — cardinal cross, icon only -->
  <section class="panel">
    <div class="cross">
      <button class="cbtn pN" data-act="lock" id="b-lock" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button class="cbtn pW" data-act="trunk" aria-label="Trunk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.9h3.3"/><path d="M13.5 16.9h5.6a2.1 2.1 0 0 0 2.1-2.3l-.6-4.7a2.5 2.5 0 0 0-2-2.1L11.7 7.5"/><path d="M2.4 4.1c4.6.1 7.4.8 9.3 3.4"/><path d="M11.7 7.5c1.9-1.9 4.2-2.9 7.5-2.8"/><circle cx="9.7" cy="16.9" r="2.9"/></svg></button>
      <button class="cbtn pE" id="b4" aria-label="Find"></button>
      <button class="cbtn pS" data-act="unlock" id="b-unlock" aria-label="Unlock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></button>
    </div>
  </section>

  <!-- 3 · Climate -->
  <section class="panel" id="p-climate">
    <img class="panelbg" data-bg="bg-climate" alt="" aria-hidden="true">
    <div class="clima-out" id="climaOut"></div>
    <div class="clima-power" data-act="clima" id="clima">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>
      <span id="climalabel">AC OFF</span>
    </div>
    <div class="stepper temp-row">
      <button data-act="temp-">−</button><div class="temp" id="temp">22<small>°</small></div><button data-act="temp+">+</button>
    </div>
    <div class="stepper fan-row">
      <button data-act="fan-">−</button>
      <div class="fanwrap">
        <div class="fanbar" id="fanbar"></div>
        <div class="fanlabel"><span data-i18n="fan">Fan</span> <b id="fannum">–</b></div>
      </div>
      <button data-act="fan+">+</button>
    </div>
  </section>

  <!-- 4 · Seats (heat + cool) -->
  <section class="panel" id="p-seat">
    <img class="panelbg" data-bg="bg-seat" alt="" aria-hidden="true">    <div class="seatcol" id="seats"></div>
  </section>

  <!-- 5 · Tyres — top-down car, each reading at its real corner (live from OD) -->
  <section class="panel" id="p-tyre">
    <div class="tyremap">
      <svg class="carmap" viewBox="0 0 120 190" fill="none" aria-hidden="true">
        <rect x="30" y="6" width="60" height="178" rx="26" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5"/>
        <rect x="17" y="34" width="14" height="34" rx="6" fill="var(--mid)"/>
        <rect x="89" y="34" width="14" height="34" rx="6" fill="var(--mid)"/>
        <rect x="17" y="122" width="14" height="34" rx="6" fill="var(--mid)"/>
        <rect x="89" y="122" width="14" height="34" rx="6" fill="var(--mid)"/>
        <rect x="40" y="28" width="40" height="60" rx="15" fill="var(--surface-1)"/>
        <rect x="44" y="104" width="32" height="30" rx="12" fill="var(--surface-1)" opacity=".55"/>
      </svg>
      <div class="tyval fl" id="ty-fl"><b>—</b><small>PSI</small></div>
      <div class="tyval fr" id="ty-fr"><b>—</b><small>PSI</small></div>
      <div class="tyval rl" id="ty-rl"><b>—</b><small>PSI</small></div>
      <div class="tyval rr" id="ty-rr"><b>—</b><small>PSI</small></div>
    </div>
  </section>

  <!-- 6 · Settings -->
  <section class="panel">    <div class="setrow" data-act="wc51">
      <span class="setname" data-i18n="b.wc51">51DK</span>

async function api(path,opts={}){
  if(demo) return demoResp(path,opts);

    headers:Object.assign({Authorization:'Bearer '+JWT},opts.body?{'Content-Type':'application/json'}:{}),body:opts.body});

  const ct=res.headers.get('content-type')||'';return ct.includes('json')?res.json():{};
}
function demoResp(path,opts){

    acc:false,soc:{percent:68},range:{totalRangeKm:495,elecRangeKm:78,fuelRangeKm:417,fuelPercent:55,isPhev:true},
    charging:{charging:true,plugged:true,chargingPowerKW:7.2},env:{tempC:24}});
  if(path.startsWith('/api/launcher/v1/summary')) return Promise.resolve({env:{tempC:24}});
  if(path.startsWith('/api/vehicle/state')) return Promise.resolve({doors:{overall:1},windows:{lf:0,rf:0,lr:0,rr:0,sunroof:0,sunshade:0},
    climate:{acOn:true,setpointDriver:22,fanLevel:3},
    seats:{heat:[2,0],cool:[0,1],ventilatedSupported:true},
    tyres:{available:true,fl:{kPa:240,psi:34.8,pressureState:0},fr:{kPa:238,psi:34.5,pressureState:0},
      rl:{kPa:205,psi:29.7,pressureState:1},rr:{kPa:242,psi:35.1,pressureState:0},limits:{frontLow:220,rearLow:220}}});
  return Promise.resolve({});
}
const pctClamp=(p)=>Math.max(0,Math.min(100,p||0));
const kpa=(t)=>t&&typeof t.kPa==='number'?Math.round(t.kPa):null;
// Pressure unit is configured in OD (/status.pressureUnit). We never convert —
// OD sends the value in each unit (t.psi / t.kPa); we display the configured one.
let pressureUnit='kpa';
const pUnitLabel=(u)=>u==='psi'?'psi':u==='bar'?'bar':'kPa';
function fmtPressure(t,u){
  if(!t||t.available===false||t.kPa==null)return '--';
  if(u==='psi')return String(t.psi??Math.round(t.kPa*0.1450377*10)/10);
  if(u==='bar')return (t.kPa/100).toFixed(2);

}
function renderTyre(id,t,limits){

  b.textContent=fmtPressure(t,pressureUnit);        // OD's value in the configured unit — no conversion
  const low=(limits&&((id.includes('f')&&v<(limits.frontLow||0))||(id.includes('r')&&v<(limits.rearLow||0))))||(t.pressureState&&t.pressureState!==0);

}
const FLAME='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#f6a23c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0c2 2 3 3 3 6a5 5 0 0 1-10 0c0-4 5-6 5-13z"/></svg>';

}

const _ico=(d,fill)=>'<svg viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="'+(fill?'none':'currentColor')+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';

const IC_POWER=_ico('<path d="M12 3v9"/><path d="M6.5 7a8 8 0 1 0 11 0"/>');

function renderStatus(s,st){
  const G='var(--success)',A='var(--m-orange)',M='var(--mid)';

  $('temp').innerHTML=tempC+'<small>°</small>';

function renderQR(id,text){
  // The QR carries the pairing URL *and* the watch's ECDH public key (~140 chars),
  // not just the 6-char code — that's why it's dense. Error-correction 'L' keeps
  // the module count (and so the density) as low as the data allows; a quiet-zone
  // margin plus the white card make it reliable to scan at close range.
  const draw=()=>{try{const q=qrcode(0,'L');q.addData(text);q.make();$(id).innerHTML=q.createSvgTag({cellSize:4,margin:2});}catch{}};
  if(window.qrcode)return draw();
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  s.onload=draw;s.onerror=()=>{};document.head.appendChild(s);
}
async function startPairing(){
  showState('<div class="spin"></div>');
  try{
    const kp=await SC.generateKey(EC,false,['deriveKey']);
    const watchPub=b64u(await SC.exportKey('raw',kp.publicKey));
    const r=await fetch(PAIR_API+'/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({watchPub})}).then(x=>x.json());
    if(!r.code) throw 0;
    // QR is just the 6-char code — scanned in the phone's pair page, which fetches
    // this session's public key from the worker by that code. Minimal, sparse QR.
    $('state').innerHTML='<div class="pairqr" id="pairqr"></div><div class="paircode">'+r.code+'</div>'
      +'<div class="sub">'+t('pair.scan')+'</div>'
      +'<button class="retry" onclick="checkPair()">'+t('pair.check')+'</button>';
    renderQR('pairqr',r.code);
    pollPair(r.code,kp);
  }catch(e){ showState('<p>'+t('st.unavail')+'</p><button class="retry" onclick="startPairing()">'+t('st.retry')+'</button>'); }
}
// Wear OS suspends JS timers while the screen is dimmed/asleep, so the poll loop
// freezes until the watch wakes. Keep the pairing context so a wake (and the
// "Check now" button) can trigger an immediate check.
let _pair=null;
async function pairTick(){
  const P=_pair;if(!P||P.stop)return;
  clearTimeout(P.t);
  let r;try{r=await fetch(PAIR_API+'/get?code='+P.code).then(x=>x.json());}
  catch{if(!P.stop)P.t=setTimeout(pairTick,1000);return;}
  if(P.stop)return;
  if(r.status==='ready'){
    P.stop=true;
    try{
      const phonePubKey=await SC.importKey('raw',ub64(r.phonePub),EC,false,[]);
      const aes=await SC.deriveKey({name:'ECDH',public:phonePubKey},P.kp.privateKey,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await SC.decrypt({name:'AES-GCM',iv:ub64(r.iv)},aes,ub64(r.ct));
      const sess=JSON.parse(new TextDecoder().decode(pt));
      if(!sess.baseUrl||!sess.jwt) throw 0;
      lss('odw.baseUrl',sess.baseUrl);lss('odw.jwt',sess.jwt);if(sess.deviceId)lss('odw.deviceId',sess.deviceId);
      showState('<div class="paircode" style="color:var(--success)">✓</div><div class="sub">Paired</div>');
      setTimeout(()=>location.reload(),500);
    }catch(e){ showState('<p>Pairing failed</p><button class="retry" onclick="startPairing()">Retry</button>'); }
    return;
  }
  if(r.status==='expired'){P.stop=true;return startPairing();}
  P.t=setTimeout(pairTick,1000);
}
function pollPair(code,kp){_pair={code,kp,stop:false,t:0};pairTick();}
// Manual "Check now" and any foreground wake trigger an immediate check.
function checkPair(){if(_pair&&!_pair.stop)pairTick();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkPair();});
window.addEventListener('focus',checkPair);
// silent=true: refresh data in place without the full-screen spinner. Used after
// a control action so the panel updates without blanking the UI and snapping the
// pager back to the first screen (which looked like a full page reload).
async function load(silent){
  if(!demo&&(!BASE||!JWT)) return startPairing();
  if(!silent) showState('<div class="spin"></div>');
  try{
    const s=await api('/status');let st={};try{st=await api('/api/vehicle/state');}catch{}
    const unit=s.distanceUnit||'km',r=s.range||{},ch=s.charging||{};
    pressureUnit=s.pressureUnit||'kpa';
    $('range').textContent=(r.totalRangeKm??r.elecRangeKm??'--');$('unit').textContent=unit;
    // EV leg
    $('ev-km').innerHTML=(r.elecRangeKm??'--')+'<small> '+unit+'</small>';
    $('ev-pct').textContent=s.soc?.percent!=null?Math.round(s.soc.percent)+'%':'--';
    $('ev-bar').style.width=pctClamp(s.soc?.percent)+'%';
    // Fuel leg (PHEV)
    if(r.isPhev){$('leg-fuel').hidden=false;
      $('fuel-km').innerHTML=(r.fuelRangeKm??'--')+'<small> '+unit+'</small>';
      $('fuel-pct').textContent=r.fuelPercent!=null?Math.round(r.fuelPercent)+'%':'--';
      $('fuel-bar').style.width=pctClamp(r.fuelPercent)+'%';}
    else $('leg-fuel').hidden=true;

    const lock=st.doors?.overall??-1;
    $('b-lock').className='cbtn pN'+(lock===1?' on':'');
    $('b-unlock').className='cbtn pS'+(lock===2?' warn':'');
    renderControls();
    renderStatus(s,st);
    outTempC=null;try{const sum=await api('/api/launcher/v1/summary');if(typeof sum.env?.tempC==='number')outTempC=sum.env.tempC;}catch{}
    climaOn=!!st.climate?.acOn;
    if(typeof st.climate?.setpointDriver==='number')tempC=Math.round(st.climate.setpointDriver);
    fanLevel=st.climate?.fanLevel||0;renderClimate();
    const h=st.seats?.heat||[],c=st.seats?.cool||[];seatHeat=[h[0]||0,h[1]||0];seatCool=[c[0]||0,c[1]||0];
    ventSupported=!!st.seats?.ventilatedSupported;renderSeats();
    const T=st.tyres||{};renderTyre('ty-fl',T.fl,T.limits);renderTyre('ty-fr',T.fr,T.limits);renderTyre('ty-rl',T.rl,T.limits);renderTyre('ty-rr',T.rr,T.limits);
    $('devid').textContent=demo?'DEMO-SEAL-01':'';
    if(!silent) hideState();
  }catch(e){if(e.auth)return showState('<p>'+t('st.ended')+'</p><p class="sub">'+t('st.repair')+'</p>');
    // A silent refresh already has a working screen up — don't replace it with a
    // full error page over a transient blip; a toast is enough.
    if(silent)return toast(t('st.unreach'),true);
    showState('<p>'+t('st.unreach')+'</p><button class="retry" onclick="load()">'+t('st.retry')+'</button>');}
}
function showState(h){$('state').innerHTML=h;$('state').hidden=false;$('pager').hidden=true;$('dots').hidden=true;}
function hideState(){$('state').hidden=true;$('pager').hidden=false;$('dots').hidden=false;try{focusPager();}catch{}}
let toastT;function toast(m,err){const t=$('toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1700);}
async function fire(label,path,body){
  if(busy)return;busy=true;document.body.classList.add('busy');
  try{const r=await api(path,{method:'POST',body:body?JSON.stringify(body):undefined});
    toast(r.success===false?(r.error||label+' '+t('toast.fail')):label+' ✓',r.success===false);if(r.success!==false)await load(true);}
  catch(e){if(e.auth)return showState('<p>'+t('st.ended')+'</p><p class="sub">'+t('st.repair')+'</p>');toast(label+' '+t('toast.fail'),true);}
  finally{busy=false;document.body.classList.remove('busy');}
}
document.addEventListener('click',(ev)=>{
  const lb=ev.target.closest('#langseg button');
  if(lb){lang=lb.dataset.lang;lss('odw.lang',lang);applyI18n();renderControls();renderClimate();renderSeats();return;}
  const tb=ev.target.closest('#themeseg button');
  if(tb){theme=tb.dataset.theme;lss('odw.theme',theme);applyTheme();return;}
  const sl=ev.target.closest('.seattile');
  if(sl){const mode=sl.dataset.mode==='cool'?'ventilation':'heating';
    fire(t('seat'),'/api/vehicle/seat',{action:mode,position:+sl.dataset.seat,level:+sl.dataset.level});return;}
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='wc51'){wc51=!wc51;lss('odw.wc51',wc51?'1':'0');renderControls();return;}
  if(wc51&&(a==='lock'||a==='unlock'||a==='trunk'||a==='start')){fireWC(label(a),a);return;}
  if(a==='lock')fire('Lock','/api/vehicle/lock');
  else if(a==='unlock')fire('Unlock','/api/vehicle/unlock');
  else if(a==='trunk')fire('Trunk','/api/vehicle/trunk',{action:'open'});
  else if(a==='flash')fire(t('b.find'),'/api/vehicle/flash');
  else if(a==='clima')fire(climaOn?t('ac.off'):t('ac.on'),'/api/vehicle/climate',climaOn?{action:'power_off'}:{action:'power_on',temp:tempC,remoteDurationMinutes:15});
  else if(a==='temp+'){tempC=Math.min(30,tempC+1);renderClimate();if(climaOn)fire('°','/api/vehicle/climate',{action:'set_temp',zone:0,temp:tempC});}
  else if(a==='temp-'){tempC=Math.max(16,tempC-1);renderClimate();if(climaOn)fire('°','/api/vehicle/climate',{action:'set_temp',zone:0,temp:tempC});}
  else if(a==='fan+')setFan(fanLevel+1);
  else if(a==='fan-')setFan(fanLevel-1);
  else if(a==='logout'){if(window.OdNative&&OdNative.logout)OdNative.logout();
    else{try{localStorage.removeItem('odw.baseUrl');localStorage.removeItem('odw.jwt');}catch{}location.href=location.pathname;}}
});
const N=7,dots=$('dots');for(let i=0;i<N;i++)dots.appendChild(document.createElement('i'));
const pager=$('pager');
function updateDots(){const i=Math.round(pager.scrollLeft/pager.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));}
// Track a swipe in progress (body.sliding) so the auto-refresh never re-renders
// mid-animation. Cleared 150ms after the last scroll event.
let _slideT;
function onPagerScroll(){
  updateDots();
  const c=document.body.classList;if(!c.contains('sliding'))c.add('sliding');
  clearTimeout(_slideT);_slideT=setTimeout(()=>c.remove('sliding'),150);
}
renderControls();pager.addEventListener("scroll",onPagerScroll,{passive:true});updateDots();
// Rotating bezel / crown: Wear OS delivers rotary input as wheel events. Map a
// detent to the next/previous panel (one step, debounced). Harmless without a dial.
let _rot=false;
function rotaryStep(dir){
  if(pager.hidden)return;                 // ignore while pairing / error screens
  if(_rot)return;_rot=true;setTimeout(()=>_rot=false,280);
  const w=pager.clientWidth,cur=Math.round(pager.scrollLeft/w);
  const next=Math.max(0,Math.min(6,cur+(dir>0?1:-1)));
  pager.scrollTo({left:next*w,behavior:'smooth'});
}
function onRotary(e){const d=e.deltaY||e.deltaX;if(!d)return;e.preventDefault();rotaryStep(d>0?1:-1);}
window.addEventListener('wheel',onRotary,{passive:false});
window.__rotary=rotaryStep;

// The rotary sink is the primary path: the bezel emits VERTICAL scroll, which the
// WebView only delivers to a vertically-scrollable focused element. This hidden
// one absorbs it — we read the scroll direction, step the pager, and re-centre it.
const rotsink=$('rotsink');
let _sinkMid=0,_sinkArmed=false;
function centreSink(){_sinkMid=(rotsink.scrollHeight-rotsink.clientHeight)/2;rotsink.scrollTop=_sinkMid;
  // ignore the scroll event that this reset itself fires
  _sinkArmed=false;setTimeout(()=>_sinkArmed=true,60);}
rotsink.addEventListener('scroll',()=>{
  if(!_sinkArmed)return;
  const d=rotsink.scrollTop-_sinkMid;
  if(Math.abs(d)<4)return;
  rotaryStep(d>0?1:-1);
  centreSink();
},{passive:true});
// Focusable arrow-key support too (some watches map the bezel to keys).
window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();rotaryStep(1);}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();rotaryStep(-1);}
});
// Keep the sink focused (so rotary keeps landing) unless a text field is active.
function focusPager(){
  if(!pager.hidden&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName)){
    try{rotsink.focus({preventScroll:true});}catch{}
    if(Math.abs(rotsink.scrollTop-_sinkMid)>2)centreSink();
  }
  try{if(window.scrollX)window.scrollTo(0,0);}catch{}
}
pager.addEventListener('pointerup',focusPager);
centreSink();setInterval(focusPager,1200);
applyI18n();applyTheme();

// --- Auto-refresh: the Wear browser won't poll on its own. Silently refresh
// telemetry on a timer while the app is visible, paired, and idle; and whenever
// the app comes back to the foreground.
const canRefresh=()=>!document.hidden&&!pager.hidden&&!busy&&!document.body.classList.contains('sliding')&&(demo||(BASE&&JWT));
setInterval(()=>{if(canRefresh())load(true);},20000);
document.addEventListener('visibilitychange',()=>{if(canRefresh())load(true);});

// --- Pull-to-refresh: drag down from the top to refresh (no reload button on
// the watch browser). Only engages on a clearly-vertical downward drag, so it
// never fights the horizontal pager swipe.
const ptr=$('ptr');
let _pY=0,_pX=0,_pOn=false,_pReady=false;
function ptrReset(){_pOn=false;_pReady=false;ptr.classList.remove('spin');ptr.style.transition='';ptr.style.transform='translate(-50%,-70px)';ptr.style.opacity='0';}
document.addEventListener('touchstart',(e)=>{if(pager.hidden||busy||e.touches.length!==1)return;_pY=e.touches[0].clientY;_pX=e.touches[0].clientX;_pOn=false;},{passive:true});
document.addEventListener('touchmove',(e)=>{
  if(pager.hidden||busy||e.touches.length!==1)return;
  const dy=e.touches[0].clientY-_pY,dx=e.touches[0].clientX-_pX;
  if(!_pOn){if(dy>10&&dy>Math.abs(dx)*1.5)_pOn=true;else return;}
  if(dy<=0){ptrReset();return;}
  e.preventDefault();
  const pull=Math.min(dy*0.5,90);_pReady=pull>=60;
  ptr.style.transition='none';
  ptr.style.transform='translate(-50%,'+(pull-60)+'px) rotate('+(pull*3)+'deg)';
  ptr.style.opacity=Math.min(1,pull/45);
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!_pOn)return;_pOn=false;
  ptr.style.transition='transform .2s ease-out,opacity .2s ease-out';
  if(_pReady&&canRefresh()){
    ptr.style.transform='translate(-50%,12px)';ptr.style.opacity='1';ptr.classList.add('spin');
    Promise.resolve(load(true)).finally(()=>setTimeout(ptrReset,500));
  }else ptrReset();
});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
