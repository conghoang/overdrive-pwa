<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>OverDrive Watch</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#071019" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  /* Verbatim from the phone app's tokens.css so the watch is the same product. */
  :root{
    --bg:#071019; --surface-1:#0c1724; --surface-2:#101f30; --border:rgba(168,198,220,.12);
    --accent:#35dfc1; --accent-bright:#35dfc1;
    --success:#56d68c; --m-orange:#f6a23c; --text:#f5f9fc; --mid:#8497a8; --danger:#ff6b6b;
    --radius:16px; --shadow:0 10px 26px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:system-ui,-apple-system,"Roboto",sans-serif;font-variant-numeric:tabular-nums;
    -webkit-user-select:none;user-select:none}

  #pager{display:flex;height:100%;width:100%;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;scrollbar-width:none}
  #pager::-webkit-scrollbar{display:none}
  .panel{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10%;text-align:center}
  .ptitle{position:absolute;top:11%;left:0;right:0;font-size:4.6vmin;letter-spacing:.12em;
    font-weight:800;text-transform:uppercase;color:var(--mid)}

  #dots{position:fixed;bottom:5%;left:50%;transform:translateX(-50%);display:flex;gap:2vmin;z-index:5}
  #dots i{width:2vmin;height:2vmin;border-radius:50%;background:var(--mid);opacity:.4;transition:.2s}
  #dots i.on{opacity:1;background:var(--accent);width:6vmin;border-radius:1vmin}

  /* ---- Panel 1: range + battery/fuel bars (the PWA hero) ---- */
  .veh-range{display:flex;align-items:baseline;justify-content:center;gap:2vmin}
  .veh-range .num{font-size:27vmin;font-weight:700;letter-spacing:-.02em;line-height:1}
  .veh-range .unit{font-size:7vmin;color:var(--mid);font-weight:600}
  .legs{width:100%;margin-top:7vmin;display:flex;flex-direction:column;gap:5.5vmin}
  .leg-head{display:flex;align-items:center;gap:2.6vmin;margin-bottom:2.6vmin}
  .leg-ico{display:flex;flex:0 0 auto}.leg-ico svg{width:6.6vmin;height:6.6vmin}
  .leg-km{margin-left:auto;font-size:7.2vmin;font-weight:800;letter-spacing:-.01em}
  .leg-km small{font-size:4.2vmin;opacity:.7;font-weight:600}
  .leg-pct{font-size:4.6vmin;font-weight:700;color:var(--mid);min-width:12vmin;text-align:right}
  .leg-bar{height:4.2vmin;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .leg-bar i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.22,.61,.36,1)}
  /* Critical glance row: charge · temp · power · lock · windows. */
  .statusrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4.5vmin;
    margin-top:5.5vmin;min-height:7vmin}
  .schip{display:flex;align-items:center;gap:1.3vmin;font-size:4.6vmin;font-weight:800}
  .schip svg{width:6.2vmin;height:6.2vmin}

  /* ---- Settings ---- */
  .seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--border);border-radius:6vmin;padding:1vmin;margin-top:6vmin}
  .seg button{border:0;background:none;color:var(--mid);font-weight:800;font-size:4.4vmin;padding:1.6vmin 6vmin;border-radius:5vmin;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--on-teal)}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:4vmin;width:84%;max-width:78vmin;cursor:pointer}
  .setname{font-size:5.6vmin;font-weight:700}
  .switch{flex:0 0 auto;width:15vmin;height:9vmin;border-radius:4.5vmin;background:var(--surface-2);
    border:1px solid var(--border);position:relative;transition:background .18s}
  .switch i{position:absolute;top:1vmin;left:1vmin;width:7vmin;height:7vmin;border-radius:50%;
    background:var(--mid);transition:transform .18s,background .18s}
  .switch.on{background:var(--accent);border-color:transparent}
  .switch.on i{transform:translateX(6vmin);background:var(--on-accent)}

  /* ---- Panel 2: quick buttons (PWA quick-btn) ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:3.4vmin;width:88%;max-width:82vmin}
  .qbtn{aspect-ratio:1;border-radius:var(--radius);background:var(--surface-1);
    border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.6vmin;color:var(--text);cursor:pointer;transition:transform .08s}
  .qbtn:active{transform:scale(.95)}
  .qbtn .qi{color:var(--accent-bright);display:flex}.qbtn .qi svg{width:12vmin;height:12vmin}
  .qbtn span{font-size:4.6vmin;font-weight:600}
  .qbtn.on{border-color:var(--success)}.qbtn.on .qi{color:var(--success)}
  .qbtn.warn{border-color:var(--m-orange)}.qbtn.warn .qi{color:var(--m-orange)}

  /* ---- Panel 3: climate ---- */
  /* Centered cluster that stays inside the round face. */
  .clima-power{display:inline-flex;align-items:center;gap:2vmin;height:12vmin;padding:0 6vmin;border-radius:6vmin;
    background:var(--surface-1);border:1px solid var(--border);color:var(--mid);font-weight:800;font-size:4.6vmin;
    letter-spacing:.04em;cursor:pointer;transition:.15s}
  .clima-power svg{width:6vmin;height:6vmin}
  .clima-power.on{background:var(--accent);color:var(--on-teal);border-color:transparent}
  .stepper{display:flex;align-items:center;justify-content:center;gap:3.4vmin}
  .stepper.temp-row{margin-top:5vmin}
  .stepper.fan-row{margin-top:4vmin;gap:3vmin}
  .stepper button{flex:0 0 auto;border-radius:50%;background:var(--surface-1);border:1px solid var(--border);
    color:var(--text);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .temp-row button{width:16vmin;height:16vmin;font-size:8vmin}
  .fan-row button{width:12.5vmin;height:12.5vmin;font-size:6.5vmin}
  .stepper button:active{background:var(--surface-2)}
  .temp{font-size:16vmin;font-weight:800;letter-spacing:-.03em;min-width:24vmin;line-height:1}
  .temp small{font-size:.42em;color:var(--mid);vertical-align:top}
  .fanwrap{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;min-width:26vmin}
  .fanbar{display:flex;gap:1vmin}
  .fanseg{width:2.8vmin;height:6vmin;border-radius:1vmin;background:var(--surface-2);transition:.12s}
  .fanseg.on{background:var(--accent)}
  .fanlabel{font-size:3.8vmin;color:var(--mid);font-weight:700;letter-spacing:.04em}.fanlabel b{color:var(--text)}

  /* ---- Panel 4: seats (heat + cool) ---- */
  /* Big tap-to-cycle tiles — one target per seat/mode, no tiny pills. */
  .seatgrid{display:grid;grid-template-columns:1fr 1fr;gap:3.4vmin;width:88%;max-width:82vmin}
  .seattile{min-height:31vmin;border-radius:var(--radius);background:var(--surface-1);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8vmin;
    color:var(--text);cursor:pointer;transition:transform .08s,border-color .15s}
  .seattile:active{transform:scale(.95)}
  .seattile svg{width:8.5vmin;height:8.5vmin}
  .seattile .stname{font-size:3.8vmin;font-weight:700;color:var(--mid)}
  .seattile.on.heat{border-color:var(--m-orange)}
  .seattile.on.cool{border-color:var(--accent)}
  .slvl{display:flex;gap:1.6vmin}
  .slvl i{width:2.6vmin;height:2.6vmin;border-radius:50%;background:var(--surface-2)}
  .seattile.heat .slvl i.f{background:var(--m-orange)}
  .seattile.cool .slvl i.f{background:var(--accent)}

  /* ---- Panel 5: tyres ---- */
  .tyres{display:grid;grid-template-columns:1fr 1fr;gap:6vmin 13vmin;width:80%;max-width:80vmin}
  .ty{display:flex;flex-direction:column;align-items:center}
  .ty b{font-size:10vmin;font-weight:800;letter-spacing:-.02em;color:var(--success)}
  .ty.low b{color:var(--m-orange)}.ty.dim b{color:var(--mid)}
  .ty small{font-size:3.8vmin;letter-spacing:.1em;color:var(--mid);font-weight:700;margin-top:1vmin}

  /* ---- Panel 6: logout ---- */
  .logout{width:80%;max-width:64vmin;height:15vmin;border-radius:8vmin;background:transparent;
    border:1px solid var(--danger);color:var(--danger);font-size:5vmin;font-weight:700;cursor:pointer}
  .logout:active{background:rgba(255,107,107,.12)}

  .state{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:16%;text-align:center;background:var(--bg);z-index:10}
  .state p{margin:0;font-size:4.8vmin}.state .sub{color:var(--mid);font-size:3.8vmin;line-height:1.4}
  .pairqr{background:#fff;padding:2vmin;border-radius:4vmin;line-height:0;width:44vmin;height:44vmin}
  .pairqr svg{width:100%;height:100%;display:block}
  .paircode{font-size:9vmin;font-weight:800;letter-spacing:.16em;color:var(--accent);margin-top:1vmin}
  .retry{padding:9px 20px;border-radius:20px;background:var(--accent);color:var(--bg);border:0;font-weight:700}
  #toast{position:fixed;left:50%;bottom:13%;transform:translateX(-50%) translateY(16px);background:var(--surface-2);
    border:1px solid var(--border);padding:7px 15px;border-radius:16px;font-size:12.5px;font-weight:600;opacity:0;
    transition:.2s;pointer-events:none;z-index:20;max-width:74%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{color:var(--danger)}
  .busy{opacity:.55;pointer-events:none}
  .spin{width:8vmin;height:8vmin;border:3px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  [hidden]{display:none!important}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="state" id="state"><div class="spin"></div></div>

<div id="pager" hidden>
  <!-- 1 · Status -->
  <section class="panel">
    <div class="veh-range"><span class="num" id="range">--</span><span class="unit" id="unit">km</span></div>
    <div class="legs">
      <div class="leg" id="leg-ev">
        <div class="leg-head">
          <span class="leg-ico" style="color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M21.5 10.5v3"/></svg></span>
          <span class="leg-km" id="ev-km" style="color:var(--success)">--<small> km</small></span>
          <span class="leg-pct" id="ev-pct">--</span>
        </div>
        <div class="leg-bar"><i id="ev-bar" style="width:0;background:var(--success)"></i></div>
      </div>
      <div class="leg" id="leg-fuel" hidden>
        <div class="leg-head">
          <span class="leg-ico" style="color:var(--m-orange)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="2"/><path d="M4 10h10"/><path d="M14 7l3.2 3.2a2 2 0 0 1 .6 1.4V17a1.8 1.8 0 0 0 3.2 1.2"/></svg></span>
          <span class="leg-km" id="fuel-km" style="color:var(--m-orange)">--<small> km</small></span>
          <span class="leg-pct" id="fuel-pct">--</span>
        </div>
        <div class="leg-bar"><i id="fuel-bar" style="width:0;background:var(--m-orange)"></i></div>
      </div>
      <div class="statusrow" id="statusrow"></div>
    </div>
  </section>

  <!-- 2 · Controls -->
  <section class="panel">
    <div class="grid2">
      <div class="qbtn" data-act="lock" id="b-lock"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span data-i18n="b.lock">Lock</span></div>
      <div class="qbtn" data-act="unlock" id="b-unlock"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></span><span data-i18n="b.unlock">Unlock</span></div>
      <div class="qbtn" data-act="trunk"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.9h3.3"/><path d="M13.5 16.9h5.6a2.1 2.1 0 0 0 2.1-2.3l-.6-4.7a2.5 2.5 0 0 0-2-2.1L11.7 7.5"/><path d="M2.4 4.1c4.6.1 7.4.8 9.3 3.4"/><path d="M11.7 7.5c1.9-1.9 4.2-2.9 7.5-2.8"/><circle cx="9.7" cy="16.9" r="2.9"/></svg></span><span data-i18n="b.trunk">Trunk</span></div>
      <div class="qbtn" id="b4"></div>
    </div>
  </section>

  <!-- 3 · Climate -->
  <section class="panel">
    <div class="clima-power" data-act="clima" id="clima">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>
      <span id="climalabel">AC OFF</span>
    </div>
    <div class="stepper temp-row">
      <button data-act="temp-">−</button><div class="temp" id="temp">22<small>°</small></div><button data-act="temp+">+</button>
    </div>
    <div class="stepper fan-row">
      <button data-act="fan-">−</button>
      <div class="fanwrap">
        <div class="fanbar" id="fanbar"></div>
        <div class="fanlabel"><span data-i18n="fan">Fan</span> <b id="fannum">–</b></div>
      </div>
      <button data-act="fan+">+</button>
    </div>
  </section>

  <!-- 4 · Seats (heat + cool) -->
  <section class="panel">
    <div class="ptitle" data-i18n="t.seats">Seats</div>
    <div class="seatcol" id="seats"></div>
  </section>

  <!-- 5 · Tyres -->
  <section class="panel">
    <div class="ptitle" data-i18n="t.tyres">Tyre · kPa</div>
    <div class="tyres">
      <div class="ty" id="ty-fl"><b>—</b><small>FL</small></div><div class="ty" id="ty-fr"><b>—</b><small>FR</small></div>
      <div class="ty" id="ty-rl"><b>—</b><small>RL</small></div><div class="ty" id="ty-rr"><b>—</b><small>RR</small></div>
    </div>
  </section>

  <!-- 6 · Settings -->
  <section class="panel">
    <div class="ptitle" data-i18n="t.settings">Settings</div>
    <div class="setrow" data-act="wc51">
      <span class="setname" data-i18n="b.wc51">51DK keyless</span>
      <div class="switch" id="wcSwitch"><i></i></div>
    </div>
    <div class="seg" id="langseg"><button data-lang="en">EN</button><button data-lang="vi">VI</button></div>
  </section>

  <!-- 7 · Account -->
  <section class="panel">
    <div class="ptitle" data-i18n="t.account">Account</div>
    <button class="logout" data-act="logout" data-i18n="b.signout">Sign out</button>
    <div class="leg-pct" style="margin-top:12px" id="devid"></div>
  </section>
</div>

<div id="dots" hidden></div>
<div id="toast"></div>

<script>
const qs=new URLSearchParams(location.search),demo=qs.has('demo');
const ls=(k)=>{try{return localStorage.getItem(k)}catch{return null}};
const lss=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const BASE=(qs.get('b')||ls('odw.baseUrl')||'').replace(/\/$/,''),JWT=qs.get('t')||ls('odw.jwt')||'';
const $=(id)=>document.getElementById(id);
let lang=ls('odw.lang')||((navigator.language||'').toLowerCase().startsWith('vi')?'vi':'en');
const T={
 en:{'t.seats':'Seats','t.tyres':'Tyre \u00b7 kPa','t.settings':'Settings','t.account':'Account',
     'b.lock':'Lock','b.unlock':'Unlock','b.trunk':'Trunk','b.find':'Find','b.start':'Start',
     'b.wc51':'51DK keyless','b.signout':'Sign out','ac.on':'AC ON','ac.off':'AC OFF','fan':'Fan',
     'seat.driver':'Driver','seat.passenger':'Passenger','st.notpaired':'Not paired',
     'st.pairhint':'Pair from the phone app','st.ended':'Session ended','st.repair':'Re-pair from the phone',
     'st.unreach':'Can\u2019t reach car','st.retry':'Retry','st.unavail':'Pairing unavailable',
     'pair.scan':'Scan in the phone app,<br>or enter this code','toast.fail':'failed','seat':'Seat'},
 vi:{'t.seats':'Gh\u1ebf','t.tyres':'L\u1ed1p \u00b7 kPa','t.settings':'C\u00e0i \u0111\u1eb7t','t.account':'T\u00e0i kho\u1ea3n',
     'b.lock':'Kh\u00f3a','b.unlock':'M\u1edf kh\u00f3a','b.trunk':'C\u1ed1p','b.find':'T\u00ecm xe','b.start':'Kh\u1edfi \u0111\u1ed9ng',
     'b.wc51':'51DK kh\u00f4ng ch\u00eca','b.signout':'\u0110\u0103ng xu\u1ea5t','ac.on':'\u0110H B\u1eacT','ac.off':'\u0110H T\u1eaeT','fan':'Qu\u1ea1t',
     'seat.driver':'Gh\u1ebf l\u00e1i','seat.passenger':'Gh\u1ebf ph\u1ee5','st.notpaired':'Ch\u01b0a gh\u00e9p',
     'st.pairhint':'Gh\u00e9p t\u1eeb \u1ee9ng d\u1ee5ng \u0111i\u1ec7n tho\u1ea1i','st.ended':'Phi\u00ean \u0111\u00e3 k\u1ebft th\u00fac','st.repair':'Gh\u00e9p l\u1ea1i t\u1eeb \u0111i\u1ec7n tho\u1ea1i',
     'st.unreach':'Kh\u00f4ng k\u1ebft n\u1ed1i \u0111\u01b0\u1ee3c xe','st.retry':'Th\u1eed l\u1ea1i','st.unavail':'Kh\u00f4ng gh\u00e9p \u0111\u01b0\u1ee3c',
     'pair.scan':'Qu\u00e9t trong \u1ee9ng d\u1ee5ng,<br>ho\u1eb7c nh\u1eadp m\u00e3 n\u00e0y','toast.fail':'th\u1ea5t b\u1ea1i','seat':'Gh\u1ebf'}
};
const t=(k)=>(T[lang]&&T[lang][k])||T.en[k]||k;
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('#langseg button').forEach(bt=>bt.classList.toggle('on',bt.dataset.lang===lang));
}
// Pairing bridge (Cloudflare Worker). Override without editing via localStorage.
const PAIR_API=(ls('odw.pairApi')||'https://watch-pair.sl6vn.link').replace(/\/$/,'');
const PAIR_PAGE=location.origin+location.pathname.replace(/watch\/?$/,'pair/');
const b64u=(buf)=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=(s)=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const SC=crypto.subtle,EC={name:'ECDH',namedCurve:'P-256'};
let tempC=22,climaOn=false,fanLevel=0,seatHeat=[0,0],seatCool=[0,0],ventSupported=false,busy=false;
let wc51=ls('odw.wc51')==='1';
const WC_PKG='com.wicarlink.digitalcarkey',WC_ACT=WC_PKG+'/.ui.activity.LauncherActivity';
// No-flash: broadcast to the running app, fall back to the activity if it's dead.
const wcCmd=(cmd)=>'if pidof '+WC_PKG+' >/dev/null; then am broadcast -n '+WC_PKG+'/.app.AdbCmdReceiver --es cmd '+cmd+'; else am start -n '+WC_ACT+' --es cmd '+cmd+'; fi';
const SVG_FIND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 3 2 5 2 7h10c0-2 2-4 2-7a7 7 0 0 0-7-7z"/><path d="M9 21h6"/></svg>';
const SVG_START='<svg viewBox="0 0 24 24"><path d="M13 3 6 13h5l-1 8 7-11h-5z" fill="currentColor"/></svg>';
function renderControls(){
  const sw=$('wcSwitch');if(sw)sw.classList.toggle('on',wc51);
  const b4=$('b4');if(!b4)return;
  if(wc51){b4.dataset.act='start';b4.innerHTML='<span class="qi">'+SVG_START+'</span><span>'+t('b.start')+'</span>';}
  else{b4.dataset.act='flash';b4.innerHTML='<span class="qi">'+SVG_FIND+'</span><span>'+t('b.find')+'</span>';}
}
function fireWC(labelText,cmd){return fire(labelText,'/api/keymap/fire',{kind:'shell',cmd:wcCmd(cmd)});}
const label=(a)=>({lock:t('b.lock'),unlock:t('b.unlock'),trunk:t('b.trunk'),start:t('b.start'),flash:t('b.find')}[a]||a);

async function api(path,opts={}){
  if(demo) return demoResp(path,opts);
  const res=await fetch(BASE+path,{method:opts.method||'GET',
    headers:Object.assign({Authorization:'Bearer '+JWT},opts.body?{'Content-Type':'application/json'}:{}),body:opts.body});
  if(res.status===401){const e=new Error('auth');e.auth=1;throw e;}
  const ct=res.headers.get('content-type')||'';return ct.includes('json')?res.json():{};
}
function demoResp(path,opts){
  if(opts.method==='POST') return Promise.resolve({success:true});
  if(path==='/status') return Promise.resolve({distanceUnit:'km',
    acc:false,soc:{percent:68},range:{totalRangeKm:495,elecRangeKm:78,fuelRangeKm:417,fuelPercent:55,isPhev:true},
    charging:{charging:true,plugged:true,chargingPowerKW:7.2},env:{tempC:24}});
  if(path.startsWith('/api/launcher/v1/summary')) return Promise.resolve({env:{tempC:24}});
  if(path.startsWith('/api/vehicle/state')) return Promise.resolve({doors:{overall:1},windows:{lf:0,rf:0,lr:0,rr:0,sunroof:0,sunshade:0},
    climate:{acOn:true,setpointDriver:22,fanLevel:3},
    seats:{heat:[2,0],cool:[0,1],ventilatedSupported:true},
    tyres:{available:true,fl:{kPa:240,pressureState:0},fr:{kPa:238,pressureState:0},
      rl:{kPa:205,pressureState:1},rr:{kPa:242,pressureState:0},limits:{frontLow:220,rearLow:220}}});
  return Promise.resolve({});
}
const pctClamp=(p)=>Math.max(0,Math.min(100,p||0));
const kpa=(t)=>t&&typeof t.kPa==='number'?Math.round(t.kPa):null;
function renderTyre(id,t,limits){
  const el=$(id),b=el.querySelector('b'),v=kpa(t);el.className='ty';
  if(v==null||t?.available===false){b.textContent='—';el.classList.add('dim');return;}
  b.textContent=v;
  const low=(limits&&((id.includes('f')&&v<(limits.frontLow||0))||(id.includes('r')&&v<(limits.rearLow||0))))||(t.pressureState&&t.pressureState!==0);
  if(low) el.classList.add('low');
}
const FLAME='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#f6a23c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0c2 2 3 3 3 6a5 5 0 0 1-10 0c0-4 5-6 5-13z"/></svg>';
const SNOW='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#35dfc1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>';
function seatTile(pos,mode,cur){
  const name=pos===1?t('seat.driver'):t('seat.passenger');
  const next=(cur+1)%4;                       // tap cycles 0→1→2→3→0
  let dots='<span class="slvl">';
  for(let i=1;i<=3;i++) dots+='<i class="'+(i<=cur?'f':'')+'"></i>';
  dots+='</span>';
  return '<button class="seattile '+mode+(cur>0?' on':'')+'" data-seat="'+pos+'" data-mode="'+mode+'" data-level="'+next+'">'
    +(mode==='heat'?FLAME:SNOW)+'<span class="stname">'+name+'</span>'+dots+'</button>';
}
function renderSeats(){
  const col=$('seats');col.className='seatgrid';
  const tiles=[];
  for(const pos of[1,2]){
    tiles.push(seatTile(pos,'heat',seatHeat[pos-1]||0));
    if(ventSupported) tiles.push(seatTile(pos,'cool',seatCool[pos-1]||0));
  }
  col.innerHTML=tiles.join('');
}
function renderFan(){const fb=$('fanbar');fb.innerHTML='';
  for(let i=1;i<=7;i++){const d=document.createElement('div');d.className='fanseg'+(i<=fanLevel?' on':'');fb.appendChild(d);}
  $('fannum').textContent=fanLevel||'–';}
function setFan(n){fanLevel=Math.max(0,Math.min(7,n));renderFan();
  fire(t('fan'),'/api/vehicle/climate',{action:'set_fan',fan:fanLevel});}
// Critical glance row on screen 1: charge · temp · power · lock · windows.
const _ico=(d,fill)=>'<svg viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="'+(fill?'none':'currentColor')+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const IC_THERMO=_ico('<path d="M10 13V5a2 2 0 1 1 4 0v8a4 4 0 1 1-4 0z"/>');
const IC_POWER=_ico('<path d="M12 3v9"/><path d="M6.5 7a8 8 0 1 0 11 0"/>');
const IC_LOCK=_ico('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>');
const IC_UNLOCK=_ico('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>');
const IC_WIN=_ico('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/>');
const IC_BOLT=_ico('<path d="M13 3 6 13h5l-1 8 7-11h-5z"/>',true);
const _chip=(color,svg,val)=>'<span class="schip" style="color:'+color+'">'+svg+(val?'<b>'+val+'</b>':'')+'</span>';
function renderStatus(s,st,ot){
  const T='var(--accent)',G='var(--success)',A='var(--m-orange)',M='var(--mid)';
  const ch=s.charging||{},items=[];
  if(ch.charging) items.push(_chip(G,IC_BOLT,ch.chargingPowerKW?ch.chargingPowerKW.toFixed(1):''));
  if(typeof ot==='number') items.push(_chip(M,IC_THERMO,Math.round(ot)+'°'));
  // Green = safe (off/locked/closed), orange = attention (on/unlocked/open).
  items.push(_chip(s.acc?A:G,IC_POWER));                                  // ignition
  const lk=st.doors?.overall??-1;
  items.push(_chip(lk===2?A:lk===1?G:M, lk===2?IC_UNLOCK:IC_LOCK));       // central lock (-1 unknown = muted)
  const w=st.windows||{};
  const open=['lf','rf','lr','rr','sunroof','sunshade'].some(k=>(w[k]||0)>0);
  items.push(_chip(open?A:G,IC_WIN));                                     // windows
  $('statusrow').innerHTML=items.join('');
}
function renderClimate(){$('clima').classList.toggle('on',climaOn);
  const cl=$('climalabel');if(cl)cl.textContent=climaOn?t('ac.on'):t('ac.off');
  $('temp').innerHTML=tempC+'<small>°</small>';renderFan();}

function renderQR(id,text){
  const draw=()=>{try{const q=qrcode(0,'M');q.addData(text);q.make();$(id).innerHTML=q.createSvgTag({cellSize:4,margin:0});}catch{}};
  if(window.qrcode)return draw();
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  s.onload=draw;s.onerror=()=>{};document.head.appendChild(s);
}
async function startPairing(){
  showState('<div class="spin"></div>');
  try{
    const kp=await SC.generateKey(EC,false,['deriveKey']);
    const watchPub=b64u(await SC.exportKey('raw',kp.publicKey));
    const r=await fetch(PAIR_API+'/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({watchPub})}).then(x=>x.json());
    if(!r.code) throw 0;
    const url=PAIR_PAGE+'#c='+r.code+'&k='+watchPub;
    $('state').innerHTML='<div class="pairqr" id="pairqr"></div><div class="paircode">'+r.code+'</div>'
      +'<div class="sub">'+t('pair.scan')+'</div>';
    renderQR('pairqr',url);
    pollPair(r.code,kp);
  }catch(e){ showState('<p>'+t('st.unavail')+'</p><button class="retry" onclick="startPairing()">'+t('st.retry')+'</button>'); }
}
function pollPair(code,kp){
  let stop=false;
  const tick=async()=>{
    if(stop)return;
    let r;try{r=await fetch(PAIR_API+'/get?code='+code).then(x=>x.json());}catch{return setTimeout(tick,1600);}
    if(r.status==='ready'){
      stop=true;
      try{
        const phonePubKey=await SC.importKey('raw',ub64(r.phonePub),EC,false,[]);
        const aes=await SC.deriveKey({name:'ECDH',public:phonePubKey},kp.privateKey,{name:'AES-GCM',length:256},false,['decrypt']);
        const pt=await SC.decrypt({name:'AES-GCM',iv:ub64(r.iv)},aes,ub64(r.ct));
        const sess=JSON.parse(new TextDecoder().decode(pt));
        lss('odw.baseUrl',sess.baseUrl);lss('odw.jwt',sess.jwt);if(sess.deviceId)lss('odw.deviceId',sess.deviceId);
        location.reload();
      }catch(e){ showState('<p>Pairing failed</p><button class="retry" onclick="startPairing()">Retry</button>'); }
      return;
    }
    if(r.status==='expired'){stop=true;return startPairing();}
    setTimeout(tick,1600);
  };
  setTimeout(tick,1600);
}
async function load(){
  if(!demo&&(!BASE||!JWT)) return startPairing();
  showState('<div class="spin"></div>');
  try{
    const s=await api('/status');let st={};try{st=await api('/api/vehicle/state');}catch{}
    const unit=s.distanceUnit||'km',r=s.range||{},ch=s.charging||{};
    $('range').textContent=(r.totalRangeKm??r.elecRangeKm??'--');$('unit').textContent=unit;
    // EV leg
    $('ev-km').innerHTML=(r.elecRangeKm??'--')+'<small> '+unit+'</small>';
    $('ev-pct').textContent=s.soc?.percent!=null?Math.round(s.soc.percent)+'%':'--';
    $('ev-bar').style.width=pctClamp(s.soc?.percent)+'%';
    // Fuel leg (PHEV)
    if(r.isPhev){$('leg-fuel').hidden=false;
      $('fuel-km').innerHTML=(r.fuelRangeKm??'--')+'<small> '+unit+'</small>';
      $('fuel-pct').textContent=r.fuelPercent!=null?Math.round(r.fuelPercent)+'%':'--';
      $('fuel-bar').style.width=pctClamp(r.fuelPercent)+'%';}
    else $('leg-fuel').hidden=true;

    const lock=st.doors?.overall??-1;
    $('b-lock').className='qbtn'+(lock===1?' on':'');
    $('b-unlock').className='qbtn'+(lock===2?' warn':'');
    renderControls();
    // Outside temp lives on the launcher summary, not /status.
    let sum={};try{sum=await api('/api/launcher/v1/summary');}catch{}
    const ot=(sum.env&&typeof sum.env.tempC==='number')?sum.env.tempC:null;
    renderStatus(s,st,ot);
    climaOn=!!st.climate?.acOn;
    if(typeof st.climate?.setpointDriver==='number')tempC=Math.round(st.climate.setpointDriver);
    fanLevel=st.climate?.fanLevel||0;renderClimate();
    const h=st.seats?.heat||[],c=st.seats?.cool||[];seatHeat=[h[0]||0,h[1]||0];seatCool=[c[0]||0,c[1]||0];
    ventSupported=!!st.seats?.ventilatedSupported;renderSeats();
    const T=st.tyres||{};renderTyre('ty-fl',T.fl,T.limits);renderTyre('ty-fr',T.fr,T.limits);renderTyre('ty-rl',T.rl,T.limits);renderTyre('ty-rr',T.rr,T.limits);
    $('devid').textContent=demo?'DEMO-SEAL-01':'';
    hideState();
  }catch(e){if(e.auth)return showState('<p>'+t('st.ended')+'</p><p class="sub">'+t('st.repair')+'</p>');
    showState('<p>'+t('st.unreach')+'</p><button class="retry" onclick="load()">'+t('st.retry')+'</button>');}
}
function showState(h){$('state').innerHTML=h;$('state').hidden=false;$('pager').hidden=true;$('dots').hidden=true;}
function hideState(){$('state').hidden=true;$('pager').hidden=false;$('dots').hidden=false;}
let toastT;function toast(m,err){const t=$('toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1700);}
async function fire(label,path,body){
  if(busy)return;busy=true;document.body.classList.add('busy');
  try{const r=await api(path,{method:'POST',body:body?JSON.stringify(body):undefined});
    toast(r.success===false?(r.error||label+' '+t('toast.fail')):label+' ✓',r.success===false);if(r.success!==false)await load();}
  catch(e){if(e.auth)return showState('<p>'+t('st.ended')+'</p><p class="sub">'+t('st.repair')+'</p>');toast(label+' '+t('toast.fail'),true);}
  finally{busy=false;document.body.classList.remove('busy');}
}
document.addEventListener('click',(ev)=>{
  const lb=ev.target.closest('#langseg button');
  if(lb){lang=lb.dataset.lang;lss('odw.lang',lang);applyI18n();renderControls();renderClimate();renderSeats();return;}
  const sl=ev.target.closest('.seattile');
  if(sl){const mode=sl.dataset.mode==='cool'?'ventilation':'heating';
    fire(t('seat'),'/api/vehicle/seat',{action:mode,position:+sl.dataset.seat,level:+sl.dataset.level});return;}
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='wc51'){wc51=!wc51;lss('odw.wc51',wc51?'1':'0');renderControls();return;}
  if(wc51&&(a==='lock'||a==='unlock'||a==='trunk'||a==='start')){fireWC(label(a),a);return;}
  if(a==='lock')fire('Lock','/api/vehicle/lock');
  else if(a==='unlock')fire('Unlock','/api/vehicle/unlock');
  else if(a==='trunk')fire('Trunk','/api/vehicle/trunk',{action:'open'});
  else if(a==='flash')fire(t('b.find'),'/api/vehicle/flash');
  else if(a==='clima')fire(climaOn?t('ac.off'):t('ac.on'),'/api/vehicle/climate',climaOn?{action:'power_off'}:{action:'power_on',temp:tempC,remoteDurationMinutes:15});
  else if(a==='temp+'){tempC=Math.min(30,tempC+1);renderClimate();if(climaOn)fire('°','/api/vehicle/climate',{action:'set_temp',zone:0,temp:tempC});}
  else if(a==='temp-'){tempC=Math.max(16,tempC-1);renderClimate();if(climaOn)fire('°','/api/vehicle/climate',{action:'set_temp',zone:0,temp:tempC});}
  else if(a==='fan+')setFan(fanLevel+1);
  else if(a==='fan-')setFan(fanLevel-1);
  else if(a==='logout'){if(window.OdNative&&OdNative.logout)OdNative.logout();
    else{try{localStorage.removeItem('odw.baseUrl');localStorage.removeItem('odw.jwt');}catch{}location.href=location.pathname;}}
});
const N=7,dots=$('dots');for(let i=0;i<N;i++)dots.appendChild(document.createElement('i'));
const pager=$('pager');
function updateDots(){const i=Math.round(pager.scrollLeft/pager.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));}
renderControls();pager.addEventListener("scroll",updateDots,{passive:true});updateDots();
applyI18n();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
