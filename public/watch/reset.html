<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Updating OverDrive…</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:#071019;color:#e8eef4;font:16px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
  .spin{width:46px;height:46px;border-radius:50%;border:4px solid #1e3346;border-top-color:#35dfc1;animation:s 0.9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:19px;font-weight:700;margin:0;color:#cfe3f2}
  p{margin:0;color:#8aa0b2;max-width:320px;font-size:14px}
  a{color:#35dfc1;font-weight:700;text-decoration:none}
  .fallback{margin-top:10px}
</style>
</head>
<body>
  <div class="spin" role="status" aria-label="Updating"></div>
  <h1>Updating OverDrive…</h1>
  <p id="msg">Clearing the old version and loading the latest. This takes a few seconds.</p>
  <p class="fallback" id="fallback" hidden>Taking too long? <a id="go" href="../">Open OverDrive →</a></p>
<script>
  (function () {
    var dest = new URL('../', location.href);
    dest.searchParams.set('fresh', Date.now());
    var go = document.getElementById('go');
    if (go) go.href = dest.href;

    function finish() { location.replace(dest.href); }

    var done = false;
    function once() { if (done) return; done = true; finish(); }

    // Tear down every service worker and cache for this origin, then reload fresh.
    Promise.resolve()
      .then(function () {
        if ('serviceWorker' in navigator) {
          return navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          });
        }
      })
      .catch(function () {})
      .then(function () {
        if (window.caches && caches.keys) {
          return caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          });
        }
      })
      .catch(function () {})
      .then(once);

    // Safety nets: never leave the user stuck on this page.
    setTimeout(once, 4000);
    setTimeout(function () {
      var f = document.getElementById('fallback');
      if (f) f.hidden = false;
    }, 6000);
  })();
</script>
</body>
</html>
