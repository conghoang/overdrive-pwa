<title>Car door states</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#0c1724;color:#e8eef4;
    display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px}
  h1{font-size:17px;font-weight:700;margin:0;color:#cfe3f2}
  .sub{color:#7f93a6;font-size:13px;margin:-10px 0 0}
  .door-car{position:relative;height:440px;aspect-ratio:630/1203}
  .door-car-body,.door-swing{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .door-swing{transform:rotate(0deg);transition:transform .55s cubic-bezier(.34,1.18,.5,1)}
  .door-swing.open{transform:rotate(var(--a))}
  .door-car-ov{position:absolute;inset:0;width:100%;height:100%}
  .door-lid{fill:transparent;transition:fill .25s}
  .door-lid.open{fill:#ff6b6b;opacity:.6}
  .controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:430px}
  .chip{padding:9px 15px;border-radius:999px;border:1px solid #38506a;background:#14202e;
    color:#d6e6f2;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
  .chip.on{background:#ff6b6b;border-color:#ff6b6b;color:#1a0b0b}
  .chip.util{background:#1c2b3a;border-color:#2c4055;color:#9fc}
  .divider{width:100%;max-width:430px;height:1px;background:#1e2d3d}
</style>
<h1>Door-status — live preview</h1>
<p class="sub">Tap a door or lid to toggle it open. Real cut-out pieces, real app CSS.</p>
<div class="controls">
  <button class="chip" data-k="lf">Front&nbsp;L</button>
  <button class="chip" data-k="rf">Front&nbsp;R</button>
  <button class="chip" data-k="lr">Rear&nbsp;L</button>
  <button class="chip" data-k="rr">Rear&nbsp;R</button>
  <button class="chip" data-k="hood">Hood</button>
  <button class="chip" data-k="trunk">Trunk</button>
</div>
<div class="controls">
  <button class="chip util" id="all">All open</button>
  <button class="chip util" id="none">All closed</button>
</div>

<script>
  var map={lf:'d-lf',rf:'d-rf',lr:'d-lr',rr:'d-rr',hood:'lid-hood',trunk:'lid-trunk'};
  function set(k,on){document.getElementById(map[k]).classList.toggle('open',on);
    document.querySelector('.chip[data-k="'+k+'"]').classList.toggle('on',on);}
  document.querySelectorAll('.chip[data-k]').forEach(function(b){
    b.onclick=function(){set(b.dataset.k,!document.getElementById(map[b.dataset.k]).classList.contains('open'));};});
  document.getElementById('all').onclick=function(){Object.keys(map).forEach(function(k){set(k,true);});};
  document.getElementById('none').onclick=function(){Object.keys(map).forEach(function(k){set(k,false);});};
</script>
