<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door-status preview</title>
<style>
 :root{color-scheme:dark}*{box-sizing:border-box}
 body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#0c1724;color:#e8eef4;
   display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 14px 40px}
 h1{font-size:17px;font-weight:700;margin:0;color:#cfe3f2}
 .sub{color:#7f93a6;font-size:12.5px;margin:-8px 0 2px;text-align:center;max-width:380px}
 .car{position:relative;height:60vh;max-height:560px;aspect-ratio:630/1203}
 .car img,.car svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
 .panel{fill:transparent;stroke:transparent;stroke-width:5;transition:fill .2s,stroke .2s}
 .panel.open{fill:rgba(230,54,50,.6);stroke:rgba(255,92,88,.95);animation:p 1.6s ease-in-out infinite}
 @keyframes p{0%,100%{opacity:1}50%{opacity:.55}}
 .controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:430px}
 .chip{padding:10px 16px;border-radius:999px;border:1px solid #38506a;background:#14202e;
   color:#d6e6f2;font-weight:600;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
 .chip.on{background:#e63632;border-color:#e63632;color:#fff}
 .chip.util{background:#1c2b3a;border-color:#2c4055;color:#9fdcc9}
 .divider{width:100%;max-width:430px;height:1px;background:#1e2d3d}
</style></head><body>
<h1>Door-status — flush highlight</h1>
<p class="sub">Tap a panel to mark it open. Each open door/hood/trunk floods red on the real panel — the cluster's signal, clean over the photo (no swinging slivers).</p>
<div class="controls">
 <button class="chip" data-k="lf">Front&nbsp;L</button><button class="chip" data-k="rf">Front&nbsp;R</button>
 <button class="chip" data-k="lr">Rear&nbsp;L</button><button class="chip" data-k="rr">Rear&nbsp;R</button>
 <button class="chip" data-k="hood">Hood</button><button class="chip" data-k="trunk">Trunk</button>
</div>
<div class="controls"><button class="chip util" id="all">All open</button><button class="chip util" id="none">All closed</button></div>

<script>
 function pan(k){return document.querySelector('.panel[data-k="'+k+'"]');}
 function chip(k){return document.querySelector('.chip[data-k="'+k+'"]');}
 function set(k,on){pan(k).classList.toggle('open',on);chip(k).classList.toggle('on',on);}
 document.querySelectorAll('.chip[data-k]').forEach(function(b){b.onclick=function(){set(b.dataset.k,!pan(b.dataset.k).classList.contains('open'));};});
 var ks=['lf','rf','lr','rr','hood','trunk'];
 document.getElementById('all').onclick=function(){ks.forEach(function(k){set(k,true);});};
 document.getElementById('none').onclick=function(){ks.forEach(function(k){set(k,false);});};
</script></body></html>
